-dasharray="3 3"/><line x1="464.95" y1="420.00" x2="464.95" y2="92.00" stroke="#8A94A6" stroke-width="1.2"/><polygon points="464.95,420.00 468.15,412.00 461.75,412.00" fill="#8A94A6"/><polygon points="464.95,92.00 461.75,100.00 468.15,100.00" fill="#8A94A6"/><text x="496.95" y="256.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">h = 76</text><line x1="170.00" y1="92.00" x2="148.76" y2="92.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="170.00" y1="130.84" x2="148.76" y2="130.84" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="152.00" y1="92.00" x2="152.00" y2="130.84" stroke="#8A94A6" stroke-width="1.2"/><polygon points="152.00,92.00 148.80,100.00 155.20,100.00" fill="#8A94A6"/><polygon points="152.00,130.84 155.20,122.84 148.80,122.84" fill="#8A94A6"/><text x="118.00" y="111.42" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">d' = 9</text><line x1="170.00" y1="92.00" x2="82.68" y2="92.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="170.00" y1="381.16" x2="82.68" y2="381.16" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="96.00" y1="92.00" x2="96.00" y2="381.16" stroke="#8A94A6" stroke-width="1.2"/><polygon points="96.00,92.00 92.80,100.00 99.20,100.00" fill="#8A94A6"/><polygon points="96.00,381.16 99.20,373.16 92.80,373.16" fill="#8A94A6"/><text x="60.00" y="236.58" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">d = 67</text><text x="528.95" y="128.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">d = h - d' = 76 - 9 = 67 cm</text><text x="528.95" y="150.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">不是 h = 76 cm；頂／底 d' 皆 9 cm，</text><text x="528.95" y="172.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">故兩個搖擺方向的 d 都是 67 cm</text><text x="528.95" y="206.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">A<tspan dy="4.35" font-size="9.86">v</tspan><tspan dy="-4.35" font-size="14.5"> = 4 × 1.27 = 5.08 cm</tspan><tspan dy="-5.80" font-size="9.86">2</tspan></text><text x="528.95" y="228.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">密箍區 4 腳 = 外箍 2 腳 + 繫筋 2 腳</text><text x="528.95" y="250.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="400">只算外箍 → 2.54 cm<tspan dy="-5.00" font-size="8.5">2</tspan><tspan dy="5.00" font-size="12.5">，A</tspan><tspan dy="3.75" font-size="8.5">v</tspan><tspan dy="-3.75" font-size="12.5"> 少一半</tspan></text><text x="528.95" y="284.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700"