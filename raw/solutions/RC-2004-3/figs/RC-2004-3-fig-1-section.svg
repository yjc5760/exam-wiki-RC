erif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">b = 50 cm</text><line x1="111.28" y1="125.28" x2="111.28" y2="89.88" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="3 3"/><line x1="460.72" y1="125.28" x2="460.72" y2="89.88" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="3 3"/><line x1="111.28" y1="95.28" x2="460.72" y2="95.28" stroke="#1D4ED8" stroke-width="1.2"/><polygon points="111.28,95.28 119.28,98.48 119.28,92.08" fill="#1D4ED8"/><polygon points="460.72,95.28 452.72,92.08 452.72,98.48" fill="#1D4ED8"/><text x="255.80" y="108.28" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">h<tspan dy="4.20" font-size="9.52">c</tspan><tspan dy="-4.20" font-size="14"> = 42 cm</tspan></text><line x1="132.41" y1="453.59" x2="132.41" y2="496.07" stroke="#B45309" stroke-width="1" stroke-dasharray="3 3"/><line x1="286.00" y1="453.59" x2="286.00" y2="496.07" stroke="#B45309" stroke-width="1" stroke-dasharray="3 3"/><line x1="132.41" y1="489.59" x2="286.00" y2="489.59" stroke="#B45309" stroke-width="1.2"/><polygon points="132.41,489.59 140.41,492.79 140.41,486.39" fill="#B45309"/><polygon points="286.00,489.59 278.00,486.39 278.00,492.79" fill="#B45309"/><text x="177.33" y="502.59" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">h<tspan dy="4.20" font-size="9.52">x</tspan><tspan dy="-4.20" font-size="14"> = 18.46</tspan></text><rect x="540" y="103" width="10" height="30" rx="3" fill="#1D4ED8" stroke="none" stroke-width="1"/><text x="560.00" y="111.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">h<tspan dy="4.05" font-size="9.18">c</tspan><tspan dy="-4.05" font-size="13.5"> = b − 2c = 42 cm</tspan></text><text x="560.00" y="132.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">量到箍筋外緣</text><rect x="540" y="157" width="10" height="30" rx="3" fill="#1D4ED8" stroke="none" stroke-width="1"/><text x="560.00" y="165.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">A<tspan dy="4.05" font-size="9.18">ch</tspan><tspan dy="-4.05" font-size="13.5"> = h</tspan><tspan dy="4.05" font-size="9.18">c</tspan><tspan dy="-9.45" font-size="9.18">2</tspan><tspan dy="5.40" font-size="13.5"> = 1,764 cm</tspan><tspan dy="-5.40" font-size="9.18">2</tspan></text><text x="560.00" y="186.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">同基準，才可直接平方</text><rect x="540" y="211" width="10" height="30" rx="3" fill="#3F4A5A" stroke="none" stroke-width="1"/><text x="560.00" y="219.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">A<tspan dy="4.05" font-size="9.18">g</tspan><tspan dy="-4.05" font-size="13.5"> / A</tspan><tspan dy="4.05" font-size="9.18">ch</tspan><tspan dy="-4.05" font-size="13.5"> = 1.417</tspan></text><text x="560.00" y="240.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">> 1.3 → 公式一控制</text><rect x="540" y="265" width="10" height="30" rx="3" fill="#C0392B" stroke="none" stroke-width="1"/><text x="560.00" y="273.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">A<tspan dy="4.05" font-size="9.18">sh</tspan><tspan dy="-4.05" font-size="13.5"> = 3×1.29 = 3.87 cm</tspan><tspan dy="-5.40" font-size="9.18">2</tspan></text><text x="560.00" y="294.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">每方向只算 3 腿</text><rect x="540" y="319" width="10" height="30" rx="3" fill="#B45309" stroke="none" stroke-width="1"/><text x="560.00" y="327.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">h<tspan dy="4.05" font-size="9.18">x</tspan><tspan dy="-4.05" font-size="13.5"> = 18.46 cm ≤ 35</tspan></text><text x="560.00" y="348.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">繫筋水平間距</text><text x="540.00" y="394.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">有效腿數怎麼數</text><text x="540.00" y="416.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.2" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">檢核 X 向 → 只算 Y 向的腿：</text><text x="540.00" y="436.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.2" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">外箍 2 腿 ＋ Y 向繫筋 1 支 = 3</text><text x="540.00" y="460.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.2" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="400">斷面共 6 腿，但每方向只能</text><text x="540.00" y="480.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.2" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="400">算 3 腿——全部加總是常見錯</text><line x1="78" y1="574" x2="100" y2="574" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><text x="108.00" y="574.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">X 向檢核用的繫筋</text><line x1="78" y1="594" x2="100" y2="594" stroke="#B45309" stroke-width="4" stroke-linecap="round"/><text x="108.00" y="594.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">Y 向檢核用的繫筋</text><text x="390.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 1　柱斷面與圍束幾何（向量重繪）</text><text x="203.20" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.8" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="400">保護層 4 cm 為假設值（題目未給），但它直接決定 A<tspan dy="3.84" font-size="8.7">ch</tspan><tspan dy="-3.84" font-size="12.8"> 與最終間距</tspan></text></svg>