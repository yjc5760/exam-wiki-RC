3" text-anchor="start" dominant-baseline="middle" font-weight="400">φ<tspan dy="3.75" font-size="8.5">u</tspan><tspan dy="-3.75" font-size="12.5"> = ε</tspan><tspan dy="3.75" font-size="8.5">cu</tspan><tspan dy="-3.75" font-size="12.5"> / c</tspan><tspan dy="3.75" font-size="8.5">u</tspan><tspan dy="-3.75" font-size="12.5"> = 0.003 / 46.79</tspan></text><text x="156.84" y="552.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">φ<tspan dy="4.35" font-size="9.86">u</tspan><tspan dy="-4.35" font-size="14.5"> = 6.412 × 10</tspan><tspan dy="-5.80" font-size="9.86">-5</tspan><tspan dy="5.80" font-size="14.5"> rad/cm</tspan></text></g><text x="470.0" y="710" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">誰深誰淺沒有普適因果，只能實算比較 —— 「矩形應力塊力臂大所以中性軸更深」是把 kyd 也當成力平衡決定的，因果講反了</text></svg>