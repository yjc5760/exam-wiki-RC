/text><text x="171.14" y="586.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">M<tspan dy="3.90" font-size="8.84">cr</tspan><tspan dy="-3.90" font-size="13"> = 50.7 tf·m</tspan></text></g><text x="645.0" y="720" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">只算到第②格會得 30.5 tf·m，比正解少 40% —— fr 那一段就佔了 Mcr 的 40%</text></svg>