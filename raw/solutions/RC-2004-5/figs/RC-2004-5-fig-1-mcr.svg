e</tspan><tspan dy="-3.60" font-size="12">·e/S</tspan><tspan dy="3.60" font-size="8.16">b</tspan><tspan dy="-3.60" font-size="12"> = 39.53（e = 35 cm）</tspan></text><text x="136.36" y="532.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">底緣預壓 f<tspan dy="3.60" font-size="8.16">ce</tspan><tspan dy="-3.60" font-size="12"> = 56.47 kgf/cm²</tspan></text><text x="215.00" y="586.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">底緣預壓 56.47（壓）</text></g><g transform="translate(430,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="418" height="608" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="215.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">② 外加彎矩把底緣壓到零</text><text x="154.12" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">M = S<tspan dy="3.75" font-size="8.5">b</tspan><tspan dy="-3.75" font-size="12.5">·f</tspan><tspan dy="3.75" font-size="8.5">ce</tspan><tspan dy="-3.75" font-size="12.5"> = 30.5 tf·m</tspan></text><polygon points="163.20,438.00 189.20,438.00 189.20,178.00 163.20,178.00" fill="#EDF1F6" stroke="#3F4A5A" stroke-width="2.2" opacity="1.0"/><circle cx="176.20" cy="409.11" r="5.4" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.5"/><polygon points="189.20,438.00 189.20,438.00 217.87,178.00 189.20,178.00" fill="rgba(29,78,216,0.18)" stroke="#1D4ED8" stroke-width="2.2" opacity="1.0"/><line x1="189.20" y