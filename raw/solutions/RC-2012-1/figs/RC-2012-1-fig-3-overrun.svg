t-baseline="middle" font-weight="700">自由端起算 201 cm（約梁長 1/3）整段都超限 —— 補救措施必須涵蓋這一整段，不能只在端點補幾根鋼筋</text><text x="480.00" y="518.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="400">但 15.63 仍小於開裂模數 31.3：斷面尚未開裂，未開裂彈性分析成立，補鋼筋即可（不必重設計斷面）</text><text x="231.12" y="544.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">補充鋼筋承擔「全部」拉力 T = 5,275 kgf，f<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = min(0.6f</tspan><tspan dy="3.75" font-size="8.5">y</tspan><tspan dy="-3.75" font-size="12.5">, 2100) = 2,100 → A</tspan><tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5"> = 2.51 cm²</tspan></text></svg>