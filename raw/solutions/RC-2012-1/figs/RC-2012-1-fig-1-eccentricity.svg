xt><text x="423.00" y="326.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">② 彎矩圖畫在受拉側 → 全長頂部受拉</text><line x1="150.00" y1="428.00" x2="800.00" y2="428.00" stroke="#C3CAD5" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="7 4" opacity="1.0"/><text x="810.00" y="428.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">斷面重心</text><line x1="150.00" y1="394.00" x2="800.00" y2="394.00" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round" opacity="1.0"/><circle cx="182.50" cy="394.00" r="4.6" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="255.62" cy="394.00" r="4.6" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="328.75" cy="394.00" r="4.6" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="401.88" cy="394.00" r="4.6" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="475.00" cy="394.00" r="4.6" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="548.12" cy="394.00" r="4.6" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="621.25" cy="394.00" r="4.6" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="694.38" cy="394.00" r="4.6" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="767.50" cy="394.00" r="4.6" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.4"/><line x1="475.00" y1="428.00" x2="475.00" y2="403.00" stroke="#C0392B" stroke-width="2.4" stroke-linecap="round"/><polygon points="475.00,394.00 479.14,403.00 470.86,403.00" fill="#C0392B"/><text x="487.00" y="411.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">e = 30 cm</text><text x="475.00" y="374.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">③ 鋼鍵在重心上方、全長固定偏心（3 根 12.7 mm 七線絞）</text><text x="480.00" y="488.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400">偏心壓力對頂纖維造成壓應力，正好抵消自重造成的頂部拉力 —— 這是選「上方」的唯一理由</text><text x="480.00" y="514.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">代價：自由端 M = 0，上偏心在底纖維留下淨拉力 +15.63 kgf/cm²</text><text x="480.00" y="542.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">簡支梁跨中鋼鍵在下、懸臂梁固定端鋼鍵在上 —— 判準是彎矩方向，不是構材長相</text></svg>