.20" font-size="9.52">u</tspan><tspan dy="-4.20" font-size="14"> = 5.69 cm  小於  d' = 7 cm</tspan></text><text x="230.00" y="488.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">→ A's 落在中性軸「下方」＝拉力區</text><text x="230.00" y="514.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">兩排鋼筋同為紅色（都受拉），這不是筆誤</text></g><g transform="translate(460,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="448" height="548" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="230.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">應變與三個力</text><text x="230.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">壓力只剩混凝土提供</text><line x1="202.40" y1="453.00" x2="202.40" y2="128.00" stroke="#C3CAD5" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><polygon points="202.40,128.00 210.74,128.00 202.40,154.42" fill="rgba(29,78,216,0.18)" stroke="#1D4ED8" stroke-width="2.4" opacity="1.0"/><polygon points="202.40,154.42 118.40,420.50 202.40,420.50" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="2.4" opacity="1.0"/><line x1="101.60" y1="154.42" x2="303.20" y2="154.42" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4" opacity="1.0"/><text x="307.20" y="154.42" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fil