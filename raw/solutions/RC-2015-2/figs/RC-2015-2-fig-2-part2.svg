" font-weight="700" font-style="italic">C<tspan dy="3.60" font-size="8.16">c</tspan><tspan dy="-3.60" font-size="12">=47.4k</tspan></text><text x="146.58" y="464.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">ε'<tspan dy="3.75" font-size="8.5">s</tspan><tspan dy="-3.75" font-size="12.5">（拉）= 0.000691  小於  ε</tspan><tspan dy="3.75" font-size="8.5">y</tspan></text><text x="133.54" y="488.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">對 C<tspan dy="3.75" font-size="8.5">c</tspan><tspan dy="-3.75" font-size="12.5"> 作用線取矩：兩個拉力都要算</tspan></text><text x="133.43" y="514.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">M<tspan dy="4.05" font-size="9.18">n</tspan><tspan dy="-4.05" font-size="13.5"> = 20.7 tf·m　φM</tspan><tspan dy="4.05" font-size="9.18">n</tspan><tspan dy="-4.05" font-size="13.5"> = 18.6 tf·m</tspan></text></g><text x="460.0" y="660" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">只算 As,min 那一項會少掉約 3% 的彎矩；φu = εcu/cu = 5.27e-4、φy = 4.04e-5 rad/cm → μ = 13.0</text></svg>