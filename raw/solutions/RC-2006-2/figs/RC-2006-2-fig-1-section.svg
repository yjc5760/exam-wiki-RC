nt-size="14" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">18 cm</text><line x1="92.00" y1="454.00" x2="92.00" y2="553.12" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="452.00" y1="454.00" x2="452.00" y2="553.12" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="92.00" y1="538.00" x2="452.00" y2="538.00" stroke="#8A94A6" stroke-width="1.2"/><polygon points="92.00,538.00 100.00,541.20 100.00,534.80" fill="#8A94A6"/><polygon points="452.00,538.00 444.00,534.80 444.00,541.20" fill="#8A94A6"/><text x="272.00" y="551.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">b = h = 50 cm</text><rect x="464" y="103" width="10" height="30" rx="3" fill="#3F4A5A" stroke="none" stroke-width="1"/><text x="484.00" y="111.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">A<tspan dy="3.90" font-size="8.84">st</tspan><tspan dy="-3.90" font-size="13"> = 8×8.14 = 65.12 cm</tspan><tspan dy="-5.20" font-size="8.84">2</tspan></text><text x="484.00" y="132.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">3×3 扣中心</text><rect x="464" y="157" width="10" height="30" rx="3" fill="#C0392B" stroke="none" stroke-width="1"/><text x="484.00" y="165.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">6 根 @ 18 cm</text><text x="484.00" y="186.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">對 Y 軸有力臂</text><rect x="464" y="211" width="10" height="30" rx="3" fill="#C3CAD5" stroke="none" stroke-width="1"/><text x="484.00" y="219.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#C3CAD5" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">2 根 @ 0 cm</text><text x="484.00" y="240.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">落在彎曲軸上，不貢獻 I<tspan dy="3.60" font-size="8.16">se</tspan></text><rect x="464" y="265" width="10" height="30" rx="3" fill="#3F4A5A" stroke="none" stroke-width="1"/><text x="484.00" y="273.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">I<tspan dy="3.90" font-size="8.84">se</tspan><tspan dy="-3.90" font-size="13"> = 6(8.14)(18)</tspan><tspan dy="-5.20" font-size="8.84">2</tspan><tspan dy="5.20" font-size="13"> = 15,824 cm</tspan><tspan dy="-5.20" font-size="8.84">4</tspan></text><text x="484.00" y="294.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">鋼筋對形心的慣性矩</text><rect x="464" y="319" width="10" height="30" rx="3" fill="#1D4ED8" stroke="none" stroke-width="1"/><text x="484.00" y="327.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">I<tspan dy="3.90" font-size="8.84">g</tspan><tspan dy="-3.90" font-size="13"> = bh</tspan><tspan dy="-5.20" font-size="8.84">3</tspan><tspan dy="5.20" font-size="13">/12 = 520,833 cm</tspan><tspan dy="-5.20" font-size="8.84">4</tspan></text><text x="484.00" y="348.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">毛斷面</text><text x="464.00" y="398.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">⚠ 最常數錯的一步</text><text x="464.00" y="420.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.2" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">8 根不是「每排 4 根」，</text><text x="464.00" y="440.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.2" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">而是 3×3 扣掉正中心。</text><text x="464.00" y="462.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.2" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">繞 Y 軸時 6 根有力臂、</text><text x="464.00" y="482.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.2" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">2 根力臂為零。</text><line x1="92" y1="516" x2="114" y2="516" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><text x="122.00" y="516.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">力臂 18 cm（6 根）</text><line x1="92" y1="536" x2="114" y2="536" stroke="#C3CAD5" stroke-width="4" stroke-linecap="round"/><text x="122.00" y="536.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">力臂 0（2 根）</text><text x="261.51" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">圖 1　柱斷面與 I<tspan dy="5.10" font-size="11.56">se</tspan><tspan dy="-5.10" font-size="17"> 的力臂</tspan></text><text x="360.00" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.8" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">8-#10 呈 3×3 扣中心；繞 Y 軸彎曲時只有 6 根有力臂</text></svg>