JK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">漏 0.85 → 1,649 tf = 0.971 P<tspan dy="3.90" font-size="8.84">y</tspan><tspan dy="-3.90" font-size="13">　沒有橫向鋼筋卻留 97% 承載力，不可能</tspan></text><text x="263.11" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">圖 2　P<tspan dy="5.10" font-size="11.56">y</tspan><tspan dy="-5.10" font-size="17"> 與 P</tspan><tspan dy="5.10" font-size="11.56">u</tspan><tspan dy="-5.10" font-size="17"> 的三段分解：蓋層損失 vs 圍束補償</tspan></text><text x="450.00" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.8" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">兩者只差中間那一塊——把蓋層換成圍束增益。長度幾乎相同，代表剛好打平</text><text x="295.12" y="574.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">P<tspan dy="3.90" font-size="8.84">u</tspan><tspan dy="-3.90" font-size="13"> / P</tspan><tspan dy="3.90" font-size="8.84">y</tspan><tspan dy="-3.90" font-size="13"> = 0.9998　零餘裕；漏 0.85 會憑空多出 179 tf</tspan></text></svg>