ng TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">A<tspan dy="3.90" font-size="8.84">ch</tspan><tspan dy="-3.90" font-size="13"> = 42 × 42 = 1764 cm</tspan><tspan dy="-5.20" font-size="8.84">2</tspan></text><text x="628.00" y="239.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">A<tspan dy="3.90" font-size="8.84">g</tspan><tspan dy="-3.90" font-size="13">/A</tspan><tspan dy="3.90" font-size="8.84">ch</tspan><tspan dy="-3.90" font-size="13"> = 2500/1764 = 1.417</tspan></text><text x="628.00" y="268.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">相鄰主筋心距 = (42 - 2(1.27) - 3.22)/4 = 9.06 cm</text><text x="628.00" y="297.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">h<tspan dy="3.90" font-size="8.84">x</tspan><tspan dy="-3.90" font-size="13"> = 9.06 cm ≤ 35 cm ✓</tspan></text><text x="628.00" y="326.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">圖中虛線方框 ＝ 核心邊界（量至箍筋外緣）</text><rect x="608" y="366" width="452" height="174" rx="12" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="628.00" y="392.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">每方向箍筋腳數 = 外箍 2 腳 + 繫筋 3 腳 = 5 腳</text><rect x="660" y="418" width="240" height="22" rx="5" fill="#EDF1F6" stroke="none" stroke-width="1"/><line x1="682.25" y1="412" x2="682.25" y2="446" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/><text x="682.25" y="460.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">1</text><line x1="736.51" y1="412" x2="736.51" y2="446" stroke="#1D4ED8" stroke-width="3.2" stroke-linecap="round"/><text x="736.51" y="460.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">2</text><line x1="780.00" y1="412" x2="780.00" y2="446" stroke="#1D4ED8" stroke-width="3.2" stroke-linecap="round"/><text x="780.00" y="460.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">3</text><line x1="823.49" y1="412" x2="823.49" y2="446" stroke="#1D4ED8" stroke-width="3.2" stroke-linecap="round"/><text x="823.49" y="460.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">4</text><line x1="877.75" y1="412" x2="877.75" y2="446" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/><text x="877.75" y="460.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">5</text><text x="914.00" y="429.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">（x 方向；y 方向同）</text><text x="628.00" y="486.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">A<tspan dy="4.05" font-size="9.18">sh,x</tspan><tspan dy="-4.05" font-size="13.5"> = A</tspan><tspan dy="4.05" font-size="9.18">sh,y</tspan><tspan dy="-4.05" font-size="13.5"> = 5 × 1.27 = 6.35 cm</tspan><tspan dy="-5.40" font-size="9.18">2</tspan><tspan dy="5.40" font-size="13.5"> ≥ 6.31 cm</tspan><tspan dy="-5.40" font-size="9.18">2</tspan><tspan dy="5.40" font-size="13.5"> ✓</tspan></text><text x="628.00" y="512.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">A<tspan dy="3.75" font-size="8.5">sh</tspan><tspan dy="-3.75" font-size="12.5"> 是「單一方向」的量：同方向所有箍筋腳一起算</tspan></text><rect x="608" y="556" width="452" height="144" rx="12" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><line x1="628" y1="586" x2="650" y2="586" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><text x="658.00" y="586.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">外圍 D13 閉合箍筋（135° 耐震彎鉤，對角兩處）</text><line x1="628" y1="610" x2="650" y2="610" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/><text x="658.00" y="610.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">D13 垂直繫筋 ×3（鉤住上、下面中間筋）＝ x 方向腳</text><line x1="628" y1="634" x2="650" y2="634" stroke="#2E7D6F" stroke-width="4" stroke-linecap="round"/><text x="658.00" y="634.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">D13 水平繫筋 ×3（鉤住左、右面中間筋）＝ y 方向腳</text><line x1="628" y1="658" x2="650" y2="658" stroke="#3F4A5A" stroke-width="4" stroke-linecap="round"/><text x="658.00" y="658.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">16-D32 主筋（每面 5 根，含角筋）</text><text x="628.00" y="682.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">彎鉤延伸 = max(6d<tspan dy="3.60" font-size="8.16">b</tspan><tspan dy="-3.60" font-size="12">, 7.5) = 7.62 cm；繫筋 90° 彎鉤沿柱高逐層交錯</tspan></text><text x="202.83" y="722.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">三根中間主筋每一根都被繫筋直接鉤住 → h<tspan dy="3.75" font-size="8.5">x</tspan><tspan dy="-3.75" font-size="12.5"> = 9.06 cm；h</tspan><tspan dy="3.75" font-size="8.5">x</tspan><tspan dy="-3.75" font-size="12.5"> 要扣兩側各一個箍筋直徑（2 × 1.27），只扣一個會誤得 9.38 cm</tspan></text></svg>