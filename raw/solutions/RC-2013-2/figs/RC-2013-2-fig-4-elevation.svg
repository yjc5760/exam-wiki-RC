text x="287.00" y="468.50" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">15</text><line x1="250.00" y1="208.80" x2="278.32" y2="208.80" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="250.00" y1="192.00" x2="278.32" y2="192.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="274.00" y1="208.80" x2="274.00" y2="192.00" stroke="#8A94A6" stroke-width="1.2"/><polygon points="274.00,208.80 277.20,200.80 270.80,200.80" fill="#8A94A6"/><polygon points="274.00,192.00 270.80,200.00 277.20,200.00" fill="#8A94A6"/><text x="287.00" y="200.40" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">12</text><line x1="250.0" y1="535.0" x2="298.0" y2="535.0" stroke="#C0392B" stroke-width="1" stroke-dasharray="3 4"/><text x="306.00" y="535.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">密箍區　D13 @ 12 cm</text><line x1="250.0" y1="360.0" x2="298.0" y2="360.0" stroke="#B45309" stroke-width="1" stroke-dasharray="3 4"/><text x="306.00" y="360.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">密箍區以外　D13 @ 15 cm</text><line x1="250.0" y1="185.0" x2="298.0" y2="185.0" stroke="#C0392B" stroke-width="1" stroke-dasharray="3 4"/><text x="306.00" y="185.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">密箍區　D13 @ 12 cm</text><text x="306.00" y="584.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">接頭面（梁／基礎）</text><text x="306.00" y="136.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">接頭面（梁）</text><text x="306.00" y="565.60" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">首支箍筋距接頭面 ≤ s/2 = 6 cm（柱 § 18.7.5.3）</text><rect x="560" y="132" width="356" height="156" rx="12" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="580.00" y="158.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">l<tspan dy="3.75" font-size="8.5">o</tspan><tspan dy="-3.75" font-size="12.5"> 三條件皆取「大」：</tspan></text><text x="580.00" y="184.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">　① 柱斷面最大邊長 = 50 cm</text><text x="580.00" y="210.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">　② l<tspan dy="3.75" font-size="8.5">u</tspan><tspan dy="-3.75" font-size="12.5">/6 = 300/6 = 50 cm</tspan></text><text x="580.00" y="236.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">　③ 絕對下限 = 45 cm</text><text x="580.00" y="262.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">→ l<tspan dy="3.75" font-size="8.5">o</tspan><tspan dy="-3.75" font-size="12.5"> = 50 cm（柱上、下端各一段）</tspan></text><rect x="560" y="308" width="356" height="132" rx="12" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="580.00" y="332.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">密箍區內　s = min(b/4, 6d<tspan dy="3.75" font-size="8.5">b</tspan><tspan dy="-3.75" font-size="12.5">, s</tspan><tspan dy="3.75" font-size="8.5">o</tspan><tspan dy="-3.75" font-size="12.5">)</tspan></text><text x="580.00" y="358.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">　= min(12.5, 19.32, 15.0) → 12 cm</text><text x="580.00" y="384.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">密箍區外　s = min(6d<tspan dy="3.75" font-size="8.5">b</tspan><tspan dy="-3.75" font-size="12.5">, 15) </tspan></text><text x="580.00" y="410.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">　= min(19.32, 15) = 15 cm，不是 19.32 cm</text><rect x="560" y="460" width="356" height="96" rx="12" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><line x1="580" y1="486" x2="602" y2="486" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><text x="610.00" y="486.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">密箍區內 D13 @ 12 cm（本圖 10 道）</text><line x1="580" y1="510" x2="602" y2="510" stroke="#B45309" stroke-width="4" stroke-linecap="round"/><text x="610.00" y="510.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">密箍區外 D13 @ 15 cm（本圖 13 道）</text><line x1="580" y1="534" x2="602" y2="534" stroke="#3F4A5A" stroke-width="4" stroke-linecap="round"/><text x="610.00" y="534.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">縱向 D32 主筋（立面示意）</text><text x="255.20" y="700.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">若 l<tspan dy="3.75" font-size="8.5">u</tspan><tspan dy="-3.75" font-size="12.5"> 超過 300 cm，則 l</tspan><tspan dy="3.75" font-size="8.5">o</tspan><tspan dy="-3.75" font-size="12.5"> 改由 l</tspan><tspan dy="3.75" font-size="8.5">u</tspan><tspan dy="-3.75" font-size="12.5">/6 控制；作答寫成 l</tspan><tspan dy="3.75" font-size="8.5">o</tspan><tspan dy="-3.75" font-size="12.5"> = max(50, l</tspan><tspan dy="3.75" font-size="8.5">u</tspan><tspan dy="-3.75" font-size="12.5">/6) 最完整</tspan></text></svg>