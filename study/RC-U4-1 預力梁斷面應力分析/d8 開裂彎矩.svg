<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><pattern id="cx" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA7B8" stroke-width="1.0"/></pattern></defs><rect width="980" height="620" fill="#FFFFFF"/><text x="249.31" y="27.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">開裂彎矩 M<tspan dy="5.25" font-size="11.9">cr</tspan><tspan dy="-5.25" font-size="17.5">：把底纖維的壓應力一路「抵銷」到破裂模數為止</tspan></text><text x="261.30" y="50.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.6" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">底纖維從 +107.81（純預力）被外力彎矩推向 −f<tspan dy="3.78" font-size="8.57">r</tspan><tspan dy="-3.78" font-size="12.6"> = −37.42，這中間的彎矩就是 M</tspan><tspan dy="3.78" font-size="8.57">cr</tspan></text><polygon points="150.00,392.00 212.53,392.00 150.00,232.53" fill="rgba(29,78,216,0.18)" stroke="#1D4ED8" stroke-width="2.2" opacity="1.0"/><polygon points="150.00,232.53 130.97,232.53 150.00,184.00" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="2.2" opacity="1.0"/><circle cx="150.00" cy="232.53" r="3.4" fill="#FFFFFF" stroke="#B45309" stroke-width="2.0"/><line x1="150.00" y1="392.00" x2="150.00" y2="184.00" stroke="#6B7684" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><text x="123.91" y="152.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.2" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">① 只有 P<tspan dy="3.96" font-size="8.98">e</tspan></text><text x="150.00" y="171.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.4" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">M = 0</text><text x="150.00" y="416.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.6" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">底 +107.81</text><polygon points="370.00,392.00 413.74,392.00 370.00,185.13" fill="rgba(29,78,216,0.18)" stroke="#1D4ED8" stroke-width="2.2" opacity="1.0"/><polygon points="370.00,185.13 369.76,185.13 370.00,184.00" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="2.2" opacity="1.0"/><circle cx="370.00" cy="185.13" r="3.4" fill="#FFFFFF" stroke="#B45309" stroke-width="2.0"/><line x1="370.00" y1="392.00" x2="370.00" y2="184.00" stroke="#6B7684" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><text x="337.31" y="152.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.2" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">② 加自重 M<tspan dy="3.96" font-size="8.98">d</tspan></text><text x="370.00" y="171.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.4" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">M = 13.82 t-m</text><text x="370.00" y="416.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.6" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">底 +75.41</text><polygon points="590.00,392.00 572.57,392.00 590.00,345.73" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="2.2" opacity="1.0"/><polygon points="590.00,345.73 650.93,345.73 590.00,184.00" fill="rgba(29,78,216,0.18)" stroke="#1D4ED8" stroke-width="2.2" o