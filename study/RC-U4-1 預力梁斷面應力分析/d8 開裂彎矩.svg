s TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">②</text><circle cx="827.1492187499999" cy="474" r="6" fill="#C0392B"/><text x="827.15" y="454.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">③</text><circle cx="863.0307976052297" cy="474" r="6" fill="#C0392B"/><text x="863.03" y="454.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">④</text><text x="120.00" y="454.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.4" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="400">壓</text><text x="900.00" y="454.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.4" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400">拉</text><rect x="96" y="512" width="788" height="74" rx="8" fill="rgba(180,83,9,0.09)" stroke="none" stroke-width="1"/><rect x="96" y="512" width="4" height="74" fill="#B45309"/><text x="108.00" y="530.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.600000000000001" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">兩條式子就結束</text><text x="108.00" y="550.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">f<tspan dy="3.54" font-size="8.02">ce</tspan><tspan dy="-3.54" font-size="11.8"> = P</tspan><tspan dy="3.54" font-size="8.02">e</tspan><tspan dy="-3.54" font-size="11.8">/A + P</tspan><tspan dy="3.54" font-size="8.02">e</tspan><tspan dy="-3.54" font-size="11.8">·e/S</tspan><tspan dy="3.54" font-size="8.02">b</tspan><tspan dy="-3.54" font-size="11.8"> = 37.50 + 70.31 = 107.81（預力在底纖維造成的壓應力）</tspan></text><text x="108.00" y="567.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">M<tspan dy="3.54" font-size="8.02">cr</tspan><tspan dy="-3.54" font-size="11.8"> = S</tspan><tspan dy="3.54" font-size="8.02">b</tspan><tspan dy="-3.54" font-size="11.8"> (f</tspan><tspan dy="3.54" font-size="8.02">ce</tspan><tspan dy="-3.54" font-size="11.8"> + f</tspan><tspan dy="3.54" font-size="8.02">r</tspan><tspan dy="-3.54" font-size="11.8">) = 42 667 × (107.81 + 37.42) = 61.96 t-m；扣掉已作用的 M</tspan><tspan dy="3.54" font-size="8.02">d</tspan><tspan dy="-3.54" font-size="11.8"> 後，還可再加 48.14 t-m</tspan></text><text x="315.66" y="604.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.0" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">規範另要求 φM<tspan dy="3.90" font-size="8.84">n</tspan><tspan dy="-3.90" font-size="13.0"> ≥ 1.2 M</tspan><tspan dy="3.90" font-size="8.84">cr</tspan><tspan dy="-3.90" font-size="13.0">，避免「一開裂就斷」的脆性破壞。</tspan></text></svg>