<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><pattern id="cx" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA7B8" stroke-width="1.0"/></pattern></defs><rect width="980" height="620" fill="#FFFFFF"/><text x="490.00" y="27.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">失分地雷：濕混凝土沒有勁度，濕版重只能由原梁斷面獨自承擔</text><text x="255.97" y="50.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.6" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">w<tspan dy="3.78" font-size="8.57">S</tspan><tspan dy="-3.78" font-size="12.6"> = 540 kgf/m → M</tspan><tspan dy="3.78" font-size="8.57">S</tspan><tspan dy="-3.78" font-size="12.6"> = 9.72 t-m；用錯斷面模數，底纖維應力會被低估 10.53 kgf/cm²</tspan></text><rect x="40" y="78" width="412" height="336" rx="12" fill="#F7F9FB" stroke="#E1E6ED" stroke-width="1.2"/><rect x="40" y="78" width="412" height="34" rx="12" fill="rgba(46,125,111,0.14)" stroke="none" stroke-width="1"/><text x="170.24" y="97.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.4" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">✔ 正確：用預鑄梁斷面 S<tspan dy="4.02" font-size="9.11">b1</tspan></text><text x="246.00" y="128.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">梁已硬化，濕版只是「掛在梁上的重量」</text><polygon points="215.00,348.00 277.00,348.00 277.00,224.00 215.00,224.00" fill="#E7EB