 3"/><text x="490.00" y="528.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.4" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">差 10.53 kgf/cm² → 低估底部拉應力，把不合格的斷面算成合格</text><text x="490.00" y="604.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.0" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">同理：吊裝、支撐拆除、疊加靜載也各有自己的「有效斷面」，判斷準則只有一句 —— 此刻誰已經硬化。</text></svg>