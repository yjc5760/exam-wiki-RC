crosoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.4" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">有效斷面</text><text x="177.26" y="366.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">Δf<tspan dy="3.84" font-size="8.7">底</tspan><tspan dy="-3.84" font-size="12.8"> = − M</tspan><tspan dy="3.84" font-size="8.7">S</tspan><tspan dy="-3.84" font-size="12.8"> / S</tspan><tspan dy="3.84" font-size="8.7">b1</tspan><tspan dy="-3.84" font-size="12.8"> = 42 667</tspan></text><text x="246.00" y="394.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">= -22.78 kgf/cm²</text><rect x="528" y="78" width="412" height="336" rx="12" fill="#F7F9FB" stroke="#E1E6ED" stroke-width="1.2"/><rect x="528" y="78" width="412" height="34" rx="12" fill="rgba(192,57,43,0.12)" stroke="none" stroke-width="1"/><text x="664.94" y="97.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.4" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">✘ 錯誤：用組合斷面 S<tspan dy="4.02" font-size="9.11">b3</tspan></text><text x="734.00" y="128.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">版還是液體，根本無法參與抗彎</text><polygon points="703.00,348.00 765.00,348.00 765.00,224.00 703.00,224.00" fill="#E7EBF1" stroke="#3F4A5A" stroke-width="2.2" opacity="1.0"/><polygon points="703.00,348.00 765.00,348.00 765.00,224.00 703.00,224.00" fill="url(#cx)" stroke="none" stroke-width="0" opacity="1.0"/><circle cx="734.00" cy="324.75" r=