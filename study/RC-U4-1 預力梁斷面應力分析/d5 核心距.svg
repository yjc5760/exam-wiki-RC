#B45309"/><text x="192.00" y="514.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.600000000000001" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">核心距的定義與用法</text><text x="192.00" y="534.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">k<tspan dy="3.54" font-size="8.02">t</tspan><tspan dy="-3.54" font-size="11.8"> = S</tspan><tspan dy="3.54" font-size="8.02">b</tspan><tspan dy="-3.54" font-size="11.8">/A（上核心點）、k</tspan><tspan dy="3.54" font-size="8.02">b</tspan><tspan dy="-3.54" font-size="11.8"> = S</tspan><tspan dy="3.54" font-size="8.02">t</tspan><tspan dy="-3.54" font-size="11.8">/A（下核心點）；矩形斷面兩者皆為 h/6。</tspan></text><text x="192.00" y="551.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">鋼腱落在核心內 → 全斷面受壓；落在核心外 → 對側出現拉應力，但不代表不合格，只要仍在容許值內即可。</text><text x="490.00" y="604.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.0" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">核心距只是「P 單獨作用」的臨界點；真正的檢核仍要把外力彎矩 M/S 一起加進來。</text></svg>