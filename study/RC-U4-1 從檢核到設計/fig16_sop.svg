<text x="1015.7" y="68.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#6D4BC2" font-weight="bold">Step 4</text>
<text x="983.3" y="102.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22.0" fill="#6D4BC2" font-weight="bold">反算 w<tspan font-size="15.0" dy="6.2">L</tspan><tspan dy="-6.2">／P</tspan></text>
<text x="925.0" y="152.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">M<tspan font-size="10.9" dy="4.5">T,max</tspan><tspan dy="-4.5"> = S</tspan><tspan font-size="10.9" dy="4.5">b</tspan><tspan dy="-4.5">(f</tspan><tspan font-size="10.9" dy="4.5">ce</tspan><tspan dy="-4.5"> + f</tspan><tspan font-size="10.9" dy="4.5">ts</tspan><tspan dy="-4.5">)</tspan></text>
<text x="925.0" y="190.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">w<tspan font-size="10.9" dy="4.5">L,max</tspan><tspan dy="-4.5"> = 8(M</tspan><tspan font-size="10.9" dy="4.5">T</tspan><tspan dy="-4.5"> − M</tspan><tspan font-size="10.9" dy="4.5">d</tspan><tspan dy="-4.5">)/L²</tspan></text>
<text x="925.0" y="228.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">P<tspan font-size="10.9" dy="4.5">e,min</tspan><tspan dy="-4.5"> 由 ④</tspan></text>
<polygon points="160.0,300.0 280.0,340.0 160.0,380.0 40.0,340.0" fill="#FBECEA" stroke="#C0392B" stroke-width="2" stroke-linejoin="round"/>
<text x="106.2" y="346.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#C0392B" font-weight="bold">1.2M<tspan font-size="10.2" dy="4.2">cr</tspan><tspan dy="-4.2"> &gt; φM</tspan><tspan font-size="10.2" dy="4.2">n</tspan><tspan dy="-4.2">？</tspan></text>
<text x="68.7" y="412.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#C0392B" font-weight="bold">是 → 加非預力筋 A<tspan font-size="10.2" dy="4.2">s</tspan><tspan dy="-4.2"> 或減 P</tspan><tspan font-size="10.2" dy="4.2">e</tspan></text>
<polygon points="455.0,300.0 575.0,340.0 455.0,380.0 335.0,340.0" fill="#FBECEA" stroke="#C0392B" stroke-width="2" stroke-linejoin="round"/>
<text x="413.4" y="346.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#C0392B" font-weight="bold">ε<tspan font-size="10.2" dy="4.2">t</tspan><tspan dy="-4.2"> &lt; 0.005？</tspan></text>
<text x="376.3" y="412.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#C0392B" font-weight="bold">是 → φ 內插，或加壓筋</text>
<polygon points="750.0,300.0 870.0,340.0 750.0,380.0 630.0,340.0" fill="#FBECEA" stroke="#C0392B" stroke-width="2" stroke-linejoin="round"/>
<text x="705.3" y="346.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#C0392B" font-weight="bold">e<tspan font-size="10.2" dy="4.2">min</tspan><tspan dy="-4.2"> &gt; e</tspan><tspan font-size="10.2" dy="4.2">max</tspan><tspan dy="-4.2">？</tspan></text>
<text x="679.9" y="412.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#C0392B" font-weight="bold">是 → 加大斷面或調 P</text>
<text x="996.0" y="346.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#2E7D6B" font-weight="bold">全部通過</text>
<text x="985.0" y="376.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#2E7D6B" font-weight="bold">→ 設計完成</text>
<text x="365.4" y="448.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#6B7280" font-weight="normal">Step 1、2 是檢核（算出來比），Step 3、4 是設計（令等號反解）</text>
