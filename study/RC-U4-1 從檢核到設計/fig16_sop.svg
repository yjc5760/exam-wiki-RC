<text x="130.7" y="68.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#2F54C8" font-weight="bold">Step 1</text>
<text x="111.0" y="102.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22.0" fill="#2F54C8" font-weight="bold">開裂彎矩</text>
<text x="40.0" y="152.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">f<tspan font-size="10.9" dy="4.5">ce</tspan><tspan dy="-4.5"> = P</tspan><tspan font-size="10.9" dy="4.5">e</tspan><tspan dy="-4.5">/A + P</tspan><tspan font-size="10.9" dy="4.5">e</tspan><tspan dy="-4.5"> e/S</tspan><tspan font-size="10.9" dy="4.5">b</tspan></text>
<text x="40.0" y="190.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">f<tspan font-size="10.9" dy="4.5">r</tspan><tspan dy="-4.5"> = 2.0√f′</tspan><tspan font-size="10.9" dy="4.5">c</tspan></text>
<text x="40.0" y="228.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">M<tspan font-size="10.9" dy="4.5">cr</tspan><tspan dy="-4.5"> = S</tspan><tspan font-size="10.9" dy="4.5">b</tspan><tspan dy="-4.5">(f</tspan><tspan font-size="10.9" dy="4.5">ce</tspan><tspan dy="-4.5"> + f</tspan><tspan font-size="10.9" dy="4.5">r</tspan><tspan dy="-4.5">)</tspan></text>
