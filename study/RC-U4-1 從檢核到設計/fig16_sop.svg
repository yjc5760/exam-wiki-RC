<text x="720.7" y="68.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#2E7D6B" font-weight="bold">Step 3</text>
<text x="714.1" y="102.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22.0" fill="#2E7D6B" font-weight="bold">反算 e</text>
<text x="630.0" y="152.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">① 等式 → e<tspan font-size="10.9" dy="4.5">max</tspan></text>
<text x="630.0" y="190.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">④ 等式 → e<tspan font-size="10.9" dy="4.5">min</tspan></text>
<text x="630.0" y="228.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">e<tspan font-size="10.9" dy="4.5">min</tspan><tspan dy="-4.5"> ≤ e ≤ e</tspan><tspan font-size="10.9" dy="4.5">max</tspan></text>
