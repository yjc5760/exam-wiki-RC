<text x="425.7" y="68.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#C2570C" font-weight="bold">Step 2</text>
<text x="406.0" y="102.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22.0" fill="#C2570C" font-weight="bold">極限強度</text>
<text x="335.0" y="152.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">ρ<tspan font-size="10.9" dy="4.5">p</tspan><tspan dy="-4.5"> → f</tspan><tspan font-size="10.9" dy="4.5">ps</tspan><tspan dy="-4.5"> → a</tspan></text>
<text x="335.0" y="190.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">ε<tspan font-size="10.9" dy="4.5">t</tspan><tspan dy="-4.5"> 定 φ</tspan></text>
<text x="335.0" y="228.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">φM<tspan font-size="10.9" dy="4.5">n</tspan><tspan dy="-4.5"> ≥ M</tspan><tspan font-size="10.9" dy="4.5">u</tspan><tspan dy="-4.5">、1.2M</tspan><tspan font-size="10.9" dy="4.5">cr</tspan></text>
