<text x="780.0" y="100.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="bold">① 幾何</text>
<text x="780.0" y="126.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#1F2A37" font-weight="normal">tan θ = 80/90 → θ = 41.6° ≥ 25° ✓</text>
<text x="780.0" y="164.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="bold">② 節點平衡</text>
<text x="780.0" y="190.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#1F2A37" font-weight="normal">C = R/sin θ = 150.5 tf；T = R/tan θ = 112.5 tf</text>
<text x="780.0" y="228.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#C0392B" font-weight="bold">③ 拉桿</text>
<text x="780.0" y="254.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#1F2A37" font-weight="normal">A<tspan font-size="10.2" dy="4.2">s</tspan><tspan dy="-4.2"> = T/(φ f</tspan><tspan font-size="10.2" dy="4.2">y</tspan><tspan dy="-4.2">) = 35.7 cm² → 8-D25（40.5）</tspan></text>
<text x="780.0" y="292.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#2F54C8" font-weight="bold">④ 壓桿（瓶形 β<tspan font-size="10.9" dy="4.5">s</tspan><tspan dy="-4.5"> = 0.75）</tspan></text>
<text x="780.0" y="318.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#1F2A37" font-weight="normal">f<tspan font-size="10.2" dy="4.2">ce</tspan><tspan dy="-4.2"> = 178.5 → 需寬 28.1 cm</tspan></text>
<text x="780.0" y="356.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#D9661F" font-weight="bold">⑤ 支承節點（CCT β<tspan font-size="10.9" dy="4.5">n</tspan><tspan dy="-4.5"> = 0.80）</tspan></text>
<text x="780.0" y="382.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#1F2A37" font-weight="normal">f<tspan font-size="10.2" dy="4.2">ce</tspan><tspan dy="-4.2"> = 190.4 → 支承板長 ≥ 17.5 cm</tspan></text>
<text x="780.0" y="418.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="13.0" fill="#6B7280" font-weight="normal">淺藍色帶 = 壓桿寬；橘點 = 節點</text>
