<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="20.0" y="40.0" width="262.0" height="110.0" rx="12" fill="#E6F2EF" stroke="#2E7D6B" stroke-width="2"/>
<text x="115.1" y="72.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#2E7D6B" font-weight="bold">① 認機制</text>
<text x="91.5" y="104.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="bold">一般梁 → V<tspan font-size="10.9" dy="4.5">c</tspan><tspan dy="-4.5"> + V</tspan><tspan font-size="10.9" dy="4.5">s</tspan></text>
<text x="80.6" y="132.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="14.0" fill="#6B7280" font-weight="normal">φ = 0.75，V<tspan font-size="9.5" dy="3.9">c</tspan><tspan dy="-3.9"> = 13.30 tf</tspan></text>
<rect x="312.0" y="40.0" width="262.0" height="110.0" rx="12" fill="#F1EDFA" stroke="#6D4BC2" stroke-width="2"/>
<text x="394.2" y="72.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#6D4BC2" font-weight="bold">② 反算 V<tspan font-size="11.6" dy="4.8">s,req</tspan></text>
<text x="354.0" y="104.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="bold">40/0.75 − 13.30 = 40.03</text>
<text x="392.8" y="132.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="14.0" fill="#6B7280" font-weight="normal">V<tspan font-size="9.5" dy="3.9">s,req</tspan><tspan dy="-3.9"> = V</tspan><tspan font-size="9.5" dy="3.9">u</tspan><tspan dy="-3.9">/φ − V</tspan><tspan font-size="9.5" dy="3.9">c</tspan></text>
<rect x="604.0" y="40.0" width="262.0" height="110.0" rx="12" fill="#FBECEA" stroke="#C0392B" stroke-width="2"/>
<text x="682.1" y="72.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#C0392B" font-weight="bold">③ 檢查天花板</text>
<text x="651.9" y="104.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="bold">40.03 ≤ 4V<tspan font-size="10.9" dy="4.5">c</tspan><tspan dy="-4.5"> = 53.21 ✓</tspan></text>
<text x="682.9" y="132.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="14.0" fill="#6B7280" font-weight="normal">超過 → 加大斷面</text>
<rect x="896.0" y="40.0" width="262.0" height="110.0" rx="12" fill="#FBF3E4" stroke="#B7791F" stroke-width="2"/>
<text x="991.1" y="72.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#B7791F" font-weight="bold">④ 定間距</text>
<text x="962.6" y="104.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="bold">s ≤ 13.3（強度）</text>
<text x="944.4" y="132.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="14.0" fill="#6B7280" font-weight="normal">V<tspan font-size="9.5" dy="3.9">s</tspan><tspan dy="-3.9"> &gt; 2V</tspan><tspan font-size="9.5" dy="3.9">c</tspan><tspan dy="-3.9"> = 26.61 → s ≤ d/4</tspan></text>
<line x1="286.0" y1="95.0" x2="297.0" y2="95.0" stroke="#1F2A37" stroke-width="2.4" stroke-linecap="butt"/>
<polygon points="308.0,95.0 297.0,89.5 297.0,100.5" fill="#1F2A37" stroke="#1F2A37" stroke-width="1" stroke-linejoin="round"/>
<line x1="578.0" y1="95.0" x2="589.0" y2="95.0" stroke="#1F2A37" stroke-width="2.4" stroke-linecap="butt"/>
<polygon points="600.0,95.0 589.0,89.5 589.0,100.5" fill="#1F2A37" stroke="#1F2A37" stroke-width="1" stroke-linejoin="round"/>
<line x1="870.0" y1="95.0" x2="881.0" y2="95.0" stroke="#1F2A37" stroke-width="2.4" stroke-linecap="butt"/>
<polygon points="892.0,95.0 881.0,89.5 881.0,100.5" fill="#1F2A37" stroke="#1F2A37" stroke-width="1" stroke-linejoin="round"/>
<line x1="735.0" y1="154.0" x2="735.0" y2="204.0" stroke="#C0392B" stroke-width="2.2" stroke-linecap="butt"/>
<polygon points="735.0,214.0 740.0,204.0 730.0,204.0" fill="#C0392B" stroke="#C0392B" stroke-width="1" stroke-linejoin="round"/>
<rect x="614.0" y="218.0" width="242.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
<text x="654.0" y="252.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#C0392B" font-weight="bold">若 V<tspan font-size="10.2" dy="4.2">s</tspan><tspan dy="-4.2"> &gt; 4V</tspan><tspan font-size="10.2" dy="4.2">c</tspan><tspan dy="-4.2">：斜壓桿壓碎</tspan></text>
<line x1="1027.0" y1="154.0" x2="1027.0" y2="204.0" stroke="#B7791F" stroke-width="2.2" stroke-linecap="butt"/>
<polygon points="1027.0,214.0 1032.0,204.0 1022.0,204.0" fill="#B7791F" stroke="#B7791F" stroke-width="1" stroke-linejoin="round"/>
<rect x="906.0" y="218.0" width="242.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/>
<text x="927.2" y="252.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#B7791F" font-weight="bold">取 s = min(13.3, 12.5) = 12.5</text>
<rect x="20.0" y="300.0" width="1160.0" height="128.0" rx="14" fill="#1B2432" stroke="#1B2432" stroke-width="1.2"/>
<text x="392.7" y="342.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#FFFFFF" font-weight="bold">驗算：V<tspan font-size="12.9" dy="5.3">s</tspan><tspan dy="-5.3"> = 2.534 × 4200 × 50 / 12.5 = 42.57 tf</tspan></text>
<text x="361.6" y="380.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#7FC8B4" font-weight="bold">φV<tspan font-size="12.9" dy="5.3">n</tspan><tspan dy="-5.3"> = 0.75 × (13.30 + 42.57) = 41.91 tf ≥ V</tspan><tspan font-size="12.9" dy="5.3">u</tspan><tspan dy="-5.3"> = 40 tf ✓</tspan></text>
<text x="394.5" y="412.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="14.0" fill="#9FB3C8" font-weight="normal">示範梁：b<tspan font-size="9.5" dy="3.9">w</tspan><tspan dy="-3.9"> 30、d 50 cm，f′c 280、f</tspan><tspan font-size="9.5" dy="3.9">yt</tspan><tspan dy="-3.9"> 4200 kgf/cm²，D13 雙肢箍</tspan></text>
</svg>
