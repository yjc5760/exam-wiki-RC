<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="582" viewBox="0 0 1120 582" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="560" height="460"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="560" height="460"/></clipPath></defs><rect width="1120" height="582" fill="#FFFFFF"/><text x="560.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">柱題兩個最常掉分的細節</text><text x="560.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">這兩處算錯，(Pn, Mn) 會整組偏掉，後面的 φ 判斷也跟著錯</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="548" height="448" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="280.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">細節一：應力塊內的壓力筋要扣 0.85f'c</text><text x="280.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">同一塊面積不能算兩次</text><rect x="70" y="112" width="236.0" height="236" rx="6" fill="#EDF1F6" stroke="#3F4A5A" stroke-width="2.6"/><polygon points="70.00,112.00 306.00,112.00 306.00,219.06 70.00,219.06" fill="rgba(29,78,216,0.18)" stroke="#1D4ED8" stroke-width="2.2" opacity="1.0"/><text x="188.00" y="239.06" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">a = 27.2 cm</text><circle cx="112.48" cy="135.60" r="5.0" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="188.00" cy="135.60" r="5.0" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="263.52" cy="135.60" r="5.0" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="112.48" cy="230.00" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="263.52" cy="230.00" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="112.48" cy="324.40" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="188.00" cy="324.40" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="263.52" cy="324.40" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.5"/><text x="322.00" y="135.60" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">在 a 內 → 要扣</text><text x="322.00" y="324.40" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700">在 a 外 → 不扣</text><rect x="44" y="378" width="472" height="62" rx="10" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.4"/><text x="194.17" y="400.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">d<tspan dy="4.05" font-size="9.18">i</tspan><tspan dy="-4.05" font-size="13.5"> ≤ a :  F</tspan><tspan dy="4.05" font-size="9.18">i</tspan><tspan dy="-4.05" font-size="13.5">=A</tspan><tspan dy="4.05" font-size="9.18">si</tspan><tspan dy="-4.05" font-size="13.5">(f</tspan><tspan dy="4.05" font-size="9.18">si</tspan><tspan dy="-4.05" font-size="13.5">−0.85f'</tspan><tspan dy="4.05" font-size="9.18">c</tspan><tspan dy="-4.05" font-size="13.5">)</tspan></text><text x="217.62" y="424.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">d<tspan dy="4.05" font-size="9.18">i</tspan><tspan dy="-4.05" font-size="13.5"> &gt; a :  F</tspan><tspan dy="4.05" font-size="9.18">i</tspan><tspan dy="-4.05" font-size="13.5">=A</tspan><tspan dy="4.05" font-size="9.18">si</tspan><tspan dy="-4.05" font-size="13.5">f</tspan><tspan dy="4.05" font-size="9.18">si</tspan></text></g><g transform="translate(560,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="548" height="448" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="280.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">細節二：對形心取矩，中排鋼筋力臂 = 0</text><text x="280.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">它管 Pn，但完全不管 Mn</text><line x1="300.00" y1="102.00" x2="300.00" y2="372.00" stroke="#C3CAD5" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><line x1="110.00" y1="237.00" x2="500.00" y2="237.00" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 4" opacity="1.0"/><text x="106.00" y="237.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#B45309" text-anchor="end" dominant-baseline="middle" font-weight="700">形心 h/2</text><circle cx="300.00" cy="137.00" r="5.4" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.5"/><line x1="344.00" y1="137.00" x2="344.00" y2="137.00" stroke="#2E7D6F" stroke-width="1" stroke-dasharray="3 3"/><line x1="344.00" y1="237.00" x2="344.00" y2="237.00" stroke="#2E7D6F" stroke-width="1" stroke-dasharray="3 3"/><line x1="344.00" y1="137.00" x2="344.00" y2="237.00" stroke="#2E7D6F" stroke-width="1.2"/><polygon points="344.00,137.00 340.80,145.00 347.20,145.00" fill="#2E7D6F"/><polygon points="344.00,237.00 347.20,229.00 340.80,229.00" fill="#2E7D6F"/><text x="328.00" y="187.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">24 cm</text><text x="280.00" y="137.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700" font-style="italic">F=+76.9 × +24 = +18.5</text><circle cx="300.00" cy="237.00" r="5.4" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.5"/><text x="280.00" y="213.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700" font-style="italic">F=+5.0 × 0 = 0</text><text x="280.00" y="261.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700">力臂 = 0，對 Mn 沒有貢獻</text><circle cx="300.00" cy="337.00" r="5.4" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.5"/><line x1="344.00" y1="337.00" x2="344.00" y2="337.00" stroke="#2E7D6F" stroke-width="1" stroke-dasharray="3 3"/><line x1="344.00" y1="237.00" x2="344.00" y2="237.00" stroke="#2E7D6F" stroke-width="1" stroke-dasharray="3 3"/><line x1="344.00" y1="337.00" x2="344.00" y2="237.00" stroke="#2E7D6F" stroke-width="1.2"/><polygon points="344.00,337.00 347.20,329.00 340.80,329.00" fill="#2E7D6F"/><polygon points="344.00,237.00 340.80,245.00 347.20,245.00" fill="#2E7D6F"/><text x="360.00" y="287.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">24 cm</text><text x="280.00" y="337.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700" font-style="italic">F=-81.5 × -24 = +19.6</text><rect x="44" y="378" width="472" height="62" rx="10" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.4"/><text x="193.23" y="400.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">M<tspan dy="4.05" font-size="9.18">n</tspan><tspan dy="-4.05" font-size="13.5">=C</tspan><tspan dy="4.05" font-size="9.18">c</tspan><tspan dy="-4.05" font-size="13.5">(h/2−a/2)+ΣF</tspan><tspan dy="4.05" font-size="9.18">i</tspan><tspan dy="-4.05" font-size="13.5">(h/2−d</tspan><tspan dy="4.05" font-size="9.18">i</tspan><tspan dy="-4.05" font-size="13.5">)</tspan></text><text x="280.00" y="424.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">中排鋼筋拿掉，Pn 會變、Mn 一點都不變</text></g><text x="560.0" y="560" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">考場檢查法：把每排鋼筋的「在不在 a 內」與「力臂」先列成表再代。</text></svg>