<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="592" viewBox="0 0 1080 592" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="540" height="470"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="540" height="470"/></clipPath></defs><rect width="1080" height="592" fill="#FFFFFF"/><text x="540.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">梁與柱的差別不是「有沒有軸力」，是「少了一條方程式」</text><text x="540.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">兩者用的是同一個斷面假設：平面保持平面、混凝土極限應變 0.003</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="528" height="458" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="270.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">梁（RC-U1-1）</text><text x="270.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">軸力 P = 0</text><rect x="48" y="104" width="176.0" height="176" rx="6" fill="#EDF1F6" stroke="#3F4A5A" stroke-width="2.6"/><circle cx="79.68" cy="121.60" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="136.00" cy="121.60" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="192.32" cy="121.60" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="79.68" cy="192.00" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="192.32" cy="192.00" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="79.68" cy="262.40" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="136.00" cy="262.40" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="192.32" cy="262.40" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><line x1="340.00" y1="104.00" x2="340.00" y2="280.00" stroke="#C3CAD5" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><polygon points="340.00,104.00 404.00,104.00 340.00,151.52" fill="rgba(29,78,216,0.18)" stroke="#1D4ED8" stroke-width="2.2" opacity="1.0"/><polygon points="340.00,151.52 268.00,262.40 340.00,262.40" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="2.2" opacity="1.0"/><line x1="256.00" y1="151.52" x2="420.00" y2="151.52" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4" opacity="1.0"/><text x="424.00" y="151.52" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">N.A.</text><text x="410.00" y="114.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">ε<tspan dy="3.60" font-size="8.16">cu</tspan><tspan dy="-3.60" font-size="12">=0.003</tspan></text><text x="262.32" y="284.40" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">ε<tspan dy="3.90" font-size="8.84">t</tspan></text><text x="136.00" y="70.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">無軸力（P = 0）</text><rect x="40" y="330" width="460" height="102" rx="12" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.4"/><text x="62.00" y="356.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">未知數</text><text x="140.00" y="356.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">只有 c　（1 個）</text><text x="62.00" y="383.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">方程式</text><text x="140.00" y="383.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700">C<tspan dy="4.05" font-size="9.18">c</tspan><tspan dy="-4.05" font-size="13.5"> = T　（1 條）</tspan></text><text x="62.00" y="410.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">結果</text><text x="140.00" y="410.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">c 被定死 → M<tspan dy="4.05" font-size="9.18">n</tspan><tspan dy="-4.05" font-size="13.5"> 是唯一的數字</tspan></text></g><g transform="translate(540,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="528" height="458" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="270.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">柱（RC-U1-2）</text><text x="270.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">軸力 P ≠ 0：多一個未知數</text><rect x="48" y="104" width="176.0" height="176" rx="6" fill="#EDF1F6" stroke="#3F4A5A" stroke-width="2.6"/><circle cx="79.68" cy="121.60" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="136.00" cy="121.60" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="192.32" cy="121.60" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="79.68" cy="192.00" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="192.32" cy="192.00" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="79.68" cy="262.40" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="136.00" cy="262.40" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><circle cx="192.32" cy="262.40" r="5.0" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.4"/><line x1="340.00" y1="104.00" x2="340.00" y2="280.00" stroke="#C3CAD5" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><polygon points="340.00,104.00 404.00,104.00 340.00,197.93" fill="rgba(29,78,216,0.18)" stroke="#1D4ED8" stroke-width="2.2" opacity="1.0"/><polygon points="340.00,197.93 268.00,262.40 340.00,262.40" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="2.2" opacity="1.0"/><line x1="256.00" y1="197.93" x2="420.00" y2="197.93" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4" opacity="1.0"/><text x="424.00" y="197.93" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">N.A.</text><text x="410.00" y="114.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">ε<tspan dy="3.60" font-size="8.16">cu</tspan><tspan dy="-3.60" font-size="12">=0.003</tspan></text><text x="262.32" y="284.40" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">ε<tspan dy="3.90" font-size="8.84">t</tspan></text><line x1="136.00" y1="42.00" x2="136.00" y2="87.00" stroke="#C0392B" stroke-width="3.6" stroke-linecap="round"/><polygon points="136.00,98.00 130.94,87.00 141.06,87.00" fill="#C0392B"/><text x="129.01" y="30.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="16" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">P<tspan dy="4.80" font-size="10.88">n</tspan></text><rect x="40" y="330" width="460" height="102" rx="12" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.4"/><text x="62.00" y="356.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">未知數</text><text x="140.00" y="356.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">c 與 P<tspan dy="4.05" font-size="9.18">n</tspan><tspan dy="-4.05" font-size="13.5">　（2 個）</tspan></text><text x="62.00" y="383.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">方程式</text><text x="140.00" y="383.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700">ΣF = 0　（1 條）</text><text x="62.00" y="410.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">結果</text><text x="140.00" y="410.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">掃描 c → 得一整條 (P<tspan dy="4.05" font-size="9.18">n</tspan><tspan dy="-4.05" font-size="13.5">, M</tspan><tspan dy="4.05" font-size="9.18">n</tspan><tspan dy="-4.05" font-size="13.5">) 軌跡</tspan></text></g><text x="540.0" y="570" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">柱的未知數比方程式多一個，所以答案不是一個點，而是一條 P-M 軌跡。</text></svg>