<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="690" fill="#FFFFFF"/><rect x="0" y="0" width="980" height="3.5" rx="0" fill="#B45309" stroke="none" stroke-width="1"/><text x="26.00" y="30.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="19" fill="#1B2A41" text-anchor="start" dominant-baseline="middle" font-weight="700">同一根梁，三個彎矩：忘記係數時怎麼自救</text><text x="26.00" y="54.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">所有奇怪的係數都在調整「上限」與「下限」——讓延性先到</text><rect x="18" y="76" width="944" height="212" rx="12" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="40.00" y="104.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="start" dominant-baseline="middle" font-weight="700">同一根梁（40×70、頂筋 5-D25、f'c=280、fy=4200）的三種彎矩強度</text><text x="182.00" y="143.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#4C6B8A" text-anchor="end" dominant-baseline="middle" font-weight="700">φMn</text><rect x="196" y="132" width="410" height="22" rx="11.0" fill="#E6EAF0" stroke="none" stroke-width="1"/><rect x="196" y="132" width="302.57449664429527" height="22" rx="11.0" fill="#4C6B8A" stroke="none" stroke-width="1"/><text x="616.00" y="143.50" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#4C6B8A" text-anchor="start" dominant-baseline="middle" font-weight="700">54.98 t-m</text><text x="736.00" y="143.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">設計用（φ=0.9 折減）</text><text x="182.00" y="189.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#B45309" text-anchor="end" dominant-baseline="middle" font-weight="700">Mn</text><rect x="196" y="178" width="410" height="22" rx="11.0" fill="#E6EAF0" stroke="none" stroke-width="1"/><rect x="196" y="178" width="336.20000000000005" height="22" rx="11.0" fill="#B45309" stroke="none" stroke-width="1"/><text x="616.00" y="189.50" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">61.09 t-m</text><text x="736.00" y="189.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">標稱強度（φ=1.0、fy）</text><text x="182.00" y="235.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700">Mpr</text><rect x="196" y="224" width="410" height="22" rx="11.0" fill="#E6EAF0" stroke="none" stroke-width="1"/><rect x="196" y="224" width="410.0" height="22" rx="11.0" fill="#C0392B" stroke="none" stroke-width="1"/><text x="616.00" y="235.50" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">74.50 t-m</text><text x="736.00" y="235.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">可能強度（φ=1.0、1.25fy）</text><text x="40.00" y="272.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">Mpr / φMn = 1.355　→　把「希望它壞的地方」整整放大 35% 再去設計脆性側</text><rect x="18" y="302" width="462" height="230" rx="9" fill="#F4F6F9" stroke="none" stroke-width="0"/><rect x="18" y="302" width="462" height="3.2" rx="0" fill="#1E8449" stroke="none" stroke-width="1"/><text x="29.00" y="323.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1B2A41" text-anchor="start" dominant-baseline="middle" font-weight="700">希望它發生（延性側）→ 估「上限」</text><text x="29.00" y="344.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">梁端彎矩塑鉸：材料會比標稱值強</text><text x="29.00" y="361.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">· 鋼筋應力用 1.25 fy（超強＋應變硬化）</text><text x="29.00" y="378.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">· 折減係數不折減：φ = 1.0</text><text x="29.00" y="395.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">· 得到「可能彎矩強度」Mpr</text><text x="29.00" y="412.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400"></text><text x="29.00" y="429.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">邏輯：先估出這裡「最多能送出多少力」，</text><text x="29.00" y="446.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">後面所有脆性構件都拿這個力去設計。</text><rect x="500" y="302" width="462" height="230" rx="9" fill="#F4F6F9" stroke="none" stroke-width="0"/><rect x="500" y="302" width="462" height="3.2" rx="0" fill="#C0392B" stroke="none" stroke-width="1"/><text x="511.00" y="323.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1B2A41" text-anchor="start" dominant-baseline="middle" font-weight="700">絕對不准發生（脆性側）→ 估「下限」</text><text x="511.00" y="344.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">剪力、柱、接頭：能力要往保守估</text><text x="511.00" y="361.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">· 塑鉸區裂縫貫穿全深 → Vc = 0</text><text x="511.00" y="378.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">· 折減更嚴：剪力 φ=0.75、接頭 φ=0.85</text><text x="511.00" y="395.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">· 剪力牆（邊界構材未圍束）φ=0.6</text><text x="511.00" y="412.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400"></text><text x="511.00" y="429.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">邏輯：即使混凝土完全不幫忙、材料偏弱，</text><text x="511.00" y="446.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.8" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">脆性側仍要贏過延性側送來的最大力。</text><rect x="18" y="552" width="944" height="42" rx="8" fill="#1B2A41" stroke="none" stroke-width="1"/><text x="490.00" y="573.50" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" font-weight="700">口訣：要它壞的估到最大（1.25fy、φ=1.0）；不准它壞的估到最小（Vc=0、φ 更小）</text><text x="490.00" y="622.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">↑ 這兩句話可以推回本單元 80% 的係數，公式忘了也能自己補回來</text><text x="490.00" y="674.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">RC-U3-3｜d2 能力設計法的讓分法則</text></svg>