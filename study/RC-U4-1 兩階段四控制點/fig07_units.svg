<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="20.0" y="20.0" width="1160.0" height="110.0" rx="12" fill="#F4F6F9" stroke="#D5DAE1" stroke-width="1.2"/>
<text x="50.0" y="62.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="20.0" fill="#1F2A37" font-weight="bold">為什麼只有 √f′ 的係數要換？</text>
<text x="50.0" y="100.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#6B7280" font-weight="normal">0.60 f′<tspan font-size="10.9" dy="4.5">c</tspan><tspan dy="-4.5"> 是「倍數」：單位跟著 f′</tspan><tspan font-size="10.9" dy="4.5">c</tspan><tspan dy="-4.5"> 走，換不換制都是 0.60；√f′</tspan><tspan font-size="10.9" dy="4.5">c</tspan><tspan dy="-4.5"> 開根號後單位變成 √(應力)，係數必須吸收換算。</tspan></text>
<rect x="40.0" y="160.0" width="340.0" height="110.0" rx="12" fill="#EEF2FB" stroke="#2F54C8" stroke-width="2"/>
<text x="151.2" y="198.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#2F54C8" font-weight="bold">ACI（MPa 制）</text>
<text x="140.2" y="245.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="23.0" fill="#1F2A37" font-weight="bold">f<tspan font-size="15.6" dy="6.4">t</tspan><tspan dy="-6.4"> = 0.25√f′</tspan><tspan font-size="15.6" dy="6.4">ci</tspan></text>
<line x1="388.0" y1="215.0" x2="410.0" y2="215.0" stroke="#6B7280" stroke-width="2.6" stroke-linecap="butt"/>
<polygon points="422.0,215.0 410.0,209.0 410.0,221.0" fill="#6B7280" stroke="#6B7280" stroke-width="1" stroke-linejoin="round"/>
<rect x="430.0" y="160.0" width="340.0" height="110.0" rx="12" fill="#FBF3E4" stroke="#B7791F" stroke-width="2"/>
<text x="485.3" y="198.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#B7791F" font-weight="bold">代入 1 MPa = 10.197 kgf/cm²</text>
<text x="485.0" y="245.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="23.0" fill="#1F2A37" font-weight="bold">×√10.197 = ×3.193</text>
<line x1="778.0" y1="215.0" x2="800.0" y2="215.0" stroke="#6B7280" stroke-width="2.6" stroke-linecap="butt"/>
<polygon points="812.0,215.0 800.0,209.0 800.0,221.0" fill="#6B7280" stroke="#6B7280" stroke-width="1" stroke-linejoin="round"/>
<rect x="820.0" y="160.0" width="340.0" height="110.0" rx="12" fill="#E6F2EF" stroke="#2E7D6B" stroke-width="2"/>
<text x="896.0" y="198.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#2E7D6B" font-weight="bold">土木 401（kgf/cm² 制）</text>
<text x="920.2" y="245.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="23.0" fill="#1F2A37" font-weight="bold">f<tspan font-size="15.6" dy="6.4">t</tspan><tspan dy="-6.4"> = 0.80√f′</tspan><tspan font-size="15.6" dy="6.4">ci</tspan></text>
<text x="60.0" y="312.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17.0" fill="#1F2A37" font-weight="bold">係數對照</text>
<text x="180.0" y="312.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#6B7280" font-weight="normal">傳遞拉（跨中）</text>
<text x="180.0" y="344.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#1F2A37" font-weight="bold">0.25 × 3.193 = 0.80 → 0.80</text>
<text x="515.0" y="312.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#6B7280" font-weight="normal">傳遞拉（簡支端部）</text>
<text x="515.0" y="344.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#1F2A37" font-weight="bold">0.50 × 3.193 = 1.60 → 1.6</text>
<text x="850.0" y="312.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="15.0" fill="#6B7280" font-weight="normal">使用拉（Class U 上限）</text>
<text x="850.0" y="344.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#1F2A37" font-weight="bold">0.62 × 3.193 = 1.98 → 2.0</text>
<text x="327.1" y="388.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#C0392B" font-weight="bold">直接把 MPa 的 0.62 用在 kgf/cm² 題目 → 容許拉應力只剩 1/3.19，嚴重低估</text>
</svg>
