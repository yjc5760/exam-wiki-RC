<text x="635.5" y="490.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19.0" fill="#1F2A37" font-weight="bold">門檻 = ¼ × 開裂扭矩：φ × ¼ × 1.06√f′<tspan font-size="12.9" dy="5.3">c</tspan><tspan dy="-5.3"> A</tspan><tspan font-size="12.9" dy="5.3">cp</tspan><tspan dy="-5.3">²/p</tspan><tspan font-size="12.9" dy="5.3">cp</tspan><tspan dy="-5.3"> = 0.75 × ¼ × 5.07 = 0.951 t-m</tspan></text>
