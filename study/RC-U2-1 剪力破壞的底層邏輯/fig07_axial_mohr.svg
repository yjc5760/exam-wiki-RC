<text x="950.0" y="226.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="13.0" fill="#6B7280" font-weight="normal">|N<tspan font-size="8.8" dy="3.6">u</tspan><tspan dy="-3.6">| = 30 tf → |σ| = 16.67</tspan></text>
<rect x="16.0" y="372.0" width="1168.0" height="58.0" rx="10" fill="#FBECEA" stroke="#EBB4AE" stroke-width="1.2"/>
<text x="325.9" y="408.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18.0" fill="#C0392B" font-weight="bold">軸拉 30 tf 讓 σ<tspan font-size="12.2" dy="5.0">1</tspan><tspan dy="-5.0"> 從 8.9 衝到 20.5，越過 f</tspan><tspan font-size="12.2" dy="5.0">t</tspan><tspan dy="-5.0"> = 17.7：同樣的 τ 就能拉裂</tspan></text>
