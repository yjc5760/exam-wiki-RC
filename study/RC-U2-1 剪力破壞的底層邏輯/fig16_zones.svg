<text x="60.0" y="346.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="bold">示範梁 V<tspan font-size="10.9" dy="4.5">u</tspan><tspan dy="-4.5"> = 40：V</tspan><tspan font-size="10.9" dy="4.5">s,req</tspan><tspan dy="-4.5"> = 40/0.75 − 13.30 = 40.03 tf &gt; 1.06√f′c b</tspan><tspan font-size="10.9" dy="4.5">w</tspan><tspan dy="-4.5"> d = 26.61 → s</tspan><tspan font-size="10.9" dy="4.5">max</tspan><tspan dy="-4.5"> = d/4 = 12.5 cm</tspan></text>
<text x="60.0" y="380.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16.0" fill="#1F2A37" font-weight="normal">計算需求 s = 13.3 cm，但上限 12.5 控制 → 用 s = 12.5：V<tspan font-size="10.9" dy="4.5">s</tspan><tspan dy="-4.5"> = 42.57，φV</tspan><tspan font-size="10.9" dy="4.5">n</tspan><tspan dy="-4.5"> = 41.91 ≥ 40 ✓</tspan></text>
<text x="60.0" y="404.0" font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="13.0" fill="#6B7280" font-weight="normal">區間界線都是 V<tspan font-size="8.8" dy="3.6">c</tspan><tspan dy="-3.6"> 與 √f′c b</tspan><tspan font-size="8.8" dy="3.6">w</tspan><tspan dy="-3.6"> d 的倍數：先算 φV</tspan><tspan font-size="8.8" dy="3.6">c</tspan><tspan dy="-3.6">，就能一眼定位</tspan></text>
