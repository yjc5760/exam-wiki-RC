 font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="17" fill="#2E6DA4" text-anchor="start" font-weight="700" opacity="1.0">T</text><line x1="583.0" y1="182.2" x2="593.0" y2="182.2" stroke="#1B2A41" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="583.0" y1="420.0" x2="593.0" y2="420.0" stroke="#1B2A41" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="588.0" y1="182.2" x2="588.0" y2="420.0" stroke="#1B2A41" stroke-width="1.1" marker-end="url(#ah1B2A41)" marker-start="url(#ah1B2A41)"/><text x="580.0" y="305.4" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1B2A41" text-anchor="end" opacity="1.0">d − a/2</text><rect x="700.0" y="150.0" width="252.0" height="138.0" rx="8" fill="#FBE1DE" stroke="none" stroke-width="0" opacity="1.0"/><rect x="700.0" y="150.0" width="4.5" height="138.0" rx="2" fill="#C0392B" stroke="none" stroke-width="0" opacity="1.0"/><text x="714.0" y="174.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="14" fill="#1B2A41" text-anchor="start" font-weight="700" opacity="1.0">① 力的平衡線</text><text x="714.0" y="198.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">C = 0.85f'c·a·b 必須等於 T = As·fy。</text><text x="714.0" y="215.4" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">令 C = T 就解出應力塊深度 a —— 這是物理</text><text x="714.0" y="232.8" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">問題。</text><rect x="700.0" y="302.0" width="252.0" height="138.0" rx="8" fill="#E6EEF7" stroke="none" stroke-width="0" opacity="1.0"/><rect x="700.0" y="302.0" width="4.5" height="138.0" rx="2" fill="#2E6DA4" stroke="none" stroke-width="0" opacity="1.0"/><text x="714.0" y="326.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="14" fill="#1B2A41" text-anchor="start" font-weight="700" opacity="1.0">② 應變幾何線</text><text x="714.0" y="350.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">斷面線性應變 + 壓碎應變固定 0.003，相</text><text x="714.0" y="367.4" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">似三角形給出 εt = 0.003(dt−c)/c —— 這</text><text x="714.0" y="384.8" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">是幾何問題。</text><rect x="700.0" y="456.0" width="252.0" height="86.0" rx="9" fill="#1B2A41" stroke="none" stroke-width="0" opacity="1.0"/><text x="716.0" y="484.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13.5" fill="#E8734A" text-anchor="start" font-weight="700" opacity="1.0">兩線共用同一個未知數</text><text x="826.0" y="518.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="25" fill="#FFFFFF" text-anchor="middle" font-weight="700" opacity="1.0">a = β<tspan dy="6.50" font-size="18.0">1</tspan><tspan dy="-6.50"> c</tspan></text><rect x="62.0" y="574.0" width="890.0" height="62.0" rx="9" fill="#DFF0E4" stroke="#1F7A4D" stroke-width="1.3" opacity="1.0"/><text x="80.0" y="600.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#1F7A4D" text-anchor="start" font-weight="700" opacity="1.0">解題邏輯</text><text x="80.0" y="622.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" opacity="1.0">先用力平衡求 a → 換算 c → 回到幾何求 εt → 由 εt 查 φ → 取矩得 Mn。梁型怎麼變，動的都只是這兩條線其中之一。</text></svg>