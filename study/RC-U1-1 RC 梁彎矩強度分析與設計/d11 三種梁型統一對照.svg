<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><pattern id="conc" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#F4F6F9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#DCE6F0" stroke-width="1.6"/></pattern><pattern id="concC" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBE9E6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#C0392B" stroke-width="1.1" opacity="0.45"/></pattern></defs><rect x="0" y="0" width="980" height="690" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="980.0" height="4.0" rx="0" fill="#E8734A" stroke="none" stroke-width="0" opacity="1.0"/><circle cx="34.0" cy="40.0" r="16.0" fill="#1B2A41" stroke="none" stroke-width="0" opacity="1.0"/><text x="34.0" y="46.0" font-family="'Noto Serif CJK TC','Noto Serif CJK JP',serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" opacity="1.0">11</text><text x="60.0" y="47.0" font-family="'Noto Serif CJK TC','Noto Serif CJK JP',serif" font-size="21" fill="#1B2A41" text-anchor="start" font-weight="700" opacity="1.0">三種梁型，壓力塊長得不一樣而已</text><text x="60.0" y="69.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#5C7A99" text-anchor="start" opacity="1.0">C 的算法隨斷面變，T = As·fy 與 εt = 0.003(dt−c)/c 永遠不變</text><rect x="58.0" y="118.0" width="296.0" height="396.0" rx="9" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.2" opacity="1.0"/><rect x="58.0" y="118.0" width="296.0" height="5.0" rx="0" fill="#2E6DA4" stroke="none" stroke-width="0" opacity="1.0"/><text x="76.0" y="150.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="14.5" fill="#2E6DA4" text-anchor="start" font-weight="700" opacity="1.0">單筋矩形梁</text><text x="76.0" y="172.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" opacity="1.0">壓力全由混凝土提供</text><rect x="132.0" y="196.0" width="148.0" height="200.0" fill="url(#conc)" stroke="#1B2A41" stroke-width="1.8"/><rect x="132.0" y="196.0" width="148.0" height="46.0" rx="0" fill="#F0A79A" stroke="#C0392B" stroke-width="1.7" opacity="1.0"/><circle cx="154.0" cy="372.0" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="206.0" cy="372.0" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="258.0" cy="372.0" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><text x="206.0" y="420.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="700" opacity="1.0">C = 0.85f'c·a·b</text><text x="206.0" y="446.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="middle" opacity="1.0">一個壓力來源</text><rect x="76.0" y="464.0" width="260.0" height="36.0" rx="6" fill="#DCE6F0" stroke="none" stroke-width="0" opacity="1.0"/><text x="206.0" y="487.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="700" opacity="1.0">a = A<tspan dy="3.12" font-size="8.6">s</tspan><tspan dy="-3.12"> f</tspan><tspan dy="3.12" font-size="8.6">y</tspan><tspan dy="-3.12"> /(0.85f'</tspan><tspan dy="3.12" font-size="8.6">c</tspan><tspan dy="-3.12"> b)</tspan></text><rect x="370.0" y="118.0" width="296.0" height="396.0" rx="9" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.2" opacity="1.0"/><rect x="370.0" y="118.0" width="296.0" height="5.0" rx="0" fill="#C0392B" stroke="none" stroke-width="0" opacity="1.0"/><text x="388.0" y="150.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="14.5" fill="#C0392B" text-anchor="start" font-weight="700" opacity="1.0">雙筋矩形梁</text><text x="388.0" y="172.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" opacity="1.0">壓力區加了鋼筋 A's</text><rect x="444.0" y="196.0" width="148.0" height="200.0" fill="url(#conc)" stroke="#1B2A41" stroke-width="1.8"/><rect x="444.0" y="196.0" width="148.0" height="46.0" rx="0" fill="#F0A79A" stroke="#C0392B" stroke-width="1.7" opacity="1.0"/><circle cx="472.0" cy="216.0" r="6.0" fill="#C0392B" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="564.0" cy="216.0" r="6.0" fill="#C0392B" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="464.0" cy="372.0" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="500.0" cy="372.0" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="536.0" cy="372.0" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="572.0" cy="372.0" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><text x="518.0" y="420.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="700" opacity="1.0">C = Cc + Cs</text><text x="518.0" y="446.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="middle" opacity="1.0">兩個壓力來源（Cs 要扣 0.85f'c）</text><rect x="388.0" y="464.0" width="260.0" height="36.0" rx="6" fill="#F6D8D2" stroke="none" stroke-width="0" opacity="1.0"/><text x="518.0" y="487.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="700" opacity="1.0">A'<tspan dy="3.12" font-size="8.6">s</tspan><tspan dy="-3.12"> 未降伏時解 c 的二次式</tspan></text><rect x="682.0" y="118.0" width="296.0" height="396.0" rx="9" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.2" opacity="1.0"/><rect x="682.0" y="118.0" width="296.0" height="5.0" rx="0" fill="#1F7A4D" stroke="none" stroke-width="0" opacity="1.0"/><text x="700.0" y="150.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="14.5" fill="#1F7A4D" text-anchor="start" font-weight="700" opacity="1.0">T 形梁</text><text x="700.0" y="172.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" opacity="1.0">壓力區形狀從矩形變 T 形</text><rect x="722.0" y="196.0" width="216.0" height="40.0" fill="url(#conc)" stroke="#1B2A41" stroke-width="1.8"/><rect x="794.0" y="236.0" width="72.0" height="160.0" fill="url(#conc)" stroke="#1B2A41" stroke-width="1.8"/><rect x="722.0" y="196.0" width="216.0" height="40.0" rx="0" fill="#F0A79A" stroke="#C0392B" stroke-width="1.7" opacity="1.0"/><rect x="794.0" y="236.0" width="72.0" height="26.0" rx="0" fill="#F0A79A" stroke="#C0392B" stroke-width="1.7" opacity="1.0"/><circle cx="810.0" cy="372.0" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="830.0" cy="372.0" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="850.0" cy="372.0" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><text x="830.0" y="420.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="700" opacity="1.0">C = 翼板部 + 腹板部</text><text x="830.0" y="446.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="middle" opacity="1.0">寬度從 be 換成 bw</text><rect x="700.0" y="464.0" width="260.0" height="36.0" rx="6" fill="#DFF0E4" stroke="none" stroke-width="0" opacity="1.0"/><text x="830.0" y="487.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="700" opacity="1.0">先驗 a ≤ h<tspan dy="3.12" font-size="8.6">f</tspan><tspan dy="-3.12"> 再決定拆不拆</tspan></text><rect x="58.0" y="528.0" width="920.0" height="62.0" rx="9" fill="#1B2A41" stroke="none" stroke-width="0" opacity="1.0"/><text x="78.0" y="556.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#E8734A" text-anchor="start" font-weight="700" opacity="1.0">三種梁型都不變的兩件事</text><text x="470.0" y="578.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" opacity="1.0">T = A<tspan dy="3.90" font-size="10.8">s</tspan><tspan dy="-3.90"> f</tspan><tspan dy="3.90" font-size="10.8">y</tspan><tspan dy="-3.90"> </tspan></text><text x="580.0" y="578.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#DCE6F0" text-anchor="middle" opacity="1.0">與</text><text x="730.0" y="578.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" opacity="1.0">ε<tspan dy="3.90" font-size="10.8">t</tspan><tspan dy="-3.90"> = 0.003(d</tspan><tspan dy="3.90" font-size="10.8">t</tspan><tspan dy="-3.90"> − c)/c</tspan></text><rect x="58.0" y="602.0" width="920.0" height="56.0" rx="9" fill="#DFF0E4" stroke="#1F7A4D" stroke-width="1.3" opacity="1.0"/><text x="78.0" y="628.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1F7A4D" text-anchor="start" font-weight="700" opacity="1.0">所以</text><text x="140.0" y="628.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" opacity="1.0">看到新題型，只要問一句：「這次壓力區長什麼樣？」——把 C 重寫，其餘五步流水線原封不動照走。</text><text x="140.0" y="650.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#5C7A99" text-anchor="start" opacity="1.0">考卷上的單筋、雙筋、T 形梁，本質是同一題的三種外觀。</text></svg>