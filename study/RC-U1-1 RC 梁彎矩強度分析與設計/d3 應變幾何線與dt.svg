<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><pattern id="conc" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#F4F6F9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#DCE6F0" stroke-width="1.6"/></pattern><pattern id="concC" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBE9E6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#C0392B" stroke-width="1.1" opacity="0.45"/></pattern><marker id="ah4C6B8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C6B8A"/></marker><marker id="ah2E6DA4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E6DA4"/></marker><marker id="ahE8734A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E8734A"/></marker></defs><rect x="0" y="0" width="980" height="690" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="980.0" height="4.0" rx="0" fill="#E8734A" stroke="none" stroke-width="0" opacity="1.0"/><circle cx="34.0" cy="40.0" r="16.0" fill="#1B2A41" stroke="none" stroke-width="0" opacity="1.0"/><text x="34.0" y="46.0" font-family="'Noto Serif CJK TC','Noto Serif CJK JP',serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" opacity="1.0">3</text><text x="60.0" y="47.0" font-family="'Noto Serif CJK TC','Noto Serif CJK JP',serif" font-size="21" fill="#1B2A41" text-anchor="start" font-weight="700" opacity="1.0">應變幾何線：相似三角形與 dt 的陷阱</text><text x="60.0" y="69.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#5C7A99" text-anchor="start" opacity="1.0">雙排配筋時 dt &gt; d —— 算 εt 要用最外層，算力臂要用形心</text><text x="92.0" y="126.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#4C6B8A" text-anchor="start" font-weight="700" opacity="1.0">斷面（拉力筋雙排）</text><rect x="92.0" y="150.0" width="168.0" height="347.2" fill="url(#conc)" stroke="#1B2A41" stroke-width="1.8"/><circle cx="118.0" cy="469.2" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="176.0" cy="469.2" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="234.0" cy="469.2" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="136.0" cy="430.0" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="216.0" cy="430.0" r="6.5" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><line x1="84.0" y1="250.8" x2="606.0" y2="250.8" stroke="#E8734A" stroke-width="1.5" stroke-linecap="round" opacity="1.0" stroke-dasharray="7,5"/><text x="268.0" y="242.8" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#E8734A" text-anchor="start" font-weight="700" opacity="1.0">N.A.</text><line x1="69.0" y1="150.0" x2="79.0" y2="150.0" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="69.0" y1="449.6" x2="79.0" y2="449.6" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="74.0" y1="150.0" x2="74.0" y2="449.6" stroke="#4C6B8A" stroke-width="1.1" marker-end="url(#ah4C6B8A)" marker-start="url(#ah4C6B8A)"/><text x="66.0" y="304.1" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#4C6B8A" text-anchor="end" opacity="1.0">d</text><line x1="21.0" y1="150.0" x2="31.0" y2="150.0" stroke="#2E6DA4" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="21.0" y1="469.2" x2="31.0" y2="469.2" stroke="#2E6DA4" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="26.0" y1="150.0" x2="26.0" y2="469.2" stroke="#2E6DA4" stroke-width="1.1" marker-end="url(#ah2E6DA4)" marker-start="url(#ah2E6DA4)"/><text x="18.0" y="313.9" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#2E6DA4" text-anchor="end" opacity="1.0">dt</text><line x1="18.0" y1="469.2" x2="118.0" y2="469.2" stroke="#2E6DA4" stroke-width="1.0" stroke-linecap="round" opacity="1.0" stroke-dasharray="3,3"/><line x1="66.0" y1="449.6" x2="260.0" y2="449.6" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round" opacity="1.0" stroke-dasharray="3,3"/><text x="176.0" y="527.2" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#4C6B8A" text-anchor="middle" opacity="1.0">d＝拉力筋「形心」深度</text><text x="176.0" y="547.2" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#2E6DA4" text-anchor="middle" opacity="1.0">dt＝「最外層」拉力筋深度</text><text x="378.0" y="126.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#4C6B8A" text-anchor="start" font-weight="700" opacity="1.0">應變分佈</text><line x1="470.0" y1="140.0" x2="470.0" y2="509.2" stroke="#9AA9B8" stroke-width="1.1" stroke-linecap="round" opacity="1.0" stroke-dasharray="4,4"/><polygon points="470.0,150.0 528.0,150.0 470.0,250.8" fill="#FBE9E6" stroke="#C0392B" stroke-width="1.8" opacity="1.0"/><polygon points="470.0,250.8 344.3,469.2 470.0,469.2" fill="#E6EEF7" stroke="#2E6DA4" stroke-width="1.8" opacity="1.0"/><text x="499.0" y="139.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="700" opacity="1.0">εcu = 0.003</text><line x1="355.6" y1="449.6" x2="470.0" y2="449.6" stroke="#4C6B8A" stroke-width="1.5" stroke-linecap="round" opacity="1.0"/><circle cx="355.6" cy="449.6" r="3.6" fill="#4C6B8A" stroke="none" stroke-width="0" opacity="1.0"/><circle cx="344.3" cy="469.2" r="3.6" fill="#2E6DA4" stroke="none" stroke-width="0" opacity="1.0"/><text x="347.6" y="453.6" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#4C6B8A" text-anchor="end" font-weight="700" opacity="1.0">εs</text><text x="336.3" y="485.2" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13.5" fill="#2E6DA4" text-anchor="end" font-weight="700" opacity="1.0">εt</text><line x1="561.0" y1="150.0" x2="571.0" y2="150.0" stroke="#E8734A" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="561.0" y1="250.8" x2="571.0" y2="250.8" stroke="#E8734A" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="566.0" y1="150.0" x2="566.0" y2="250.8" stroke="#E8734A" stroke-width="1.1" marker-end="url(#ahE8734A)" marker-start="url(#ahE8734A)"/><text x="558.0" y="204.7" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#E8734A" text-anchor="end" opacity="1.0">c</text><line x1="357.0" y1="250.8" x2="367.0" y2="250.8" stroke="#2E6DA4" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="357.0" y1="469.2" x2="367.0" y2="469.2" stroke="#2E6DA4" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="362.0" y1="250.8" x2="362.0" y2="469.2" stroke="#2E6DA4" stroke-width="1.1" marker-end="url(#ah2E6DA4)" marker-start="url(#ah2E6DA4)"/><text x="354.0" y="364.3" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#2E6DA4" text-anchor="end" opacity="1.0">dt − c</text><text x="488.0" y="205.4" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11" fill="#C0392B" text-anchor="middle" opacity="1.0">▲</text><text x="452.0" y="349.1" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11" fill="#2E6DA4" text-anchor="middle" opacity="1.0">▲</text><text x="478.0" y="511.2" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="middle" opacity="1.0">兩個三角形相似 → 對應邊成比例</text><rect x="636.0" y="152.0" width="316.0" height="96.0" rx="9" fill="#1B2A41" stroke="none" stroke-width="0" opacity="1.0"/><text x="652.0" y="178.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#E8734A" text-anchor="start" font-weight="700" opacity="1.0">相似三角形給的唯一式子</text><text x="794.0" y="218.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="17.5" fill="#FFFFFF" text-anchor="middle" font-weight="700" opacity="1.0">ε<tspan dy="4.55" font-size="12.6">t</tspan><tspan dy="-4.55"> = 0.003 · (d</tspan><tspan dy="4.55" font-size="12.6">t</tspan><tspan dy="-4.55"> − c)/c</tspan></text><rect x="636.0" y="268.0" width="316.0" height="112.0" rx="8" fill="#E6EEF7" stroke="none" stroke-width="0" opacity="1.0"/><rect x="636.0" y="268.0" width="4.5" height="112.0" rx="2" fill="#2E6DA4" stroke="none" stroke-width="0" opacity="1.0"/><text x="650.0" y="292.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="14" fill="#1B2A41" text-anchor="start" font-weight="700" opacity="1.0">為什麼分 d 與 dt</text><text x="650.0" y="316.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">εt 是「規範用來判定延性」的指標，規範要的是最外</text><text x="650.0" y="333.4" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">層那根鋼筋的應變，所以一律代 dt；而 Mn 的力臂用的</text><text x="650.0" y="350.8" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">是全部拉力筋的合力位置 d。</text><rect x="636.0" y="396.0" width="316.0" height="104.0" rx="8" fill="#FBE1DE" stroke="none" stroke-width="0" opacity="1.0"/><rect x="636.0" y="396.0" width="4.5" height="104.0" rx="2" fill="#C0392B" stroke="none" stroke-width="0" opacity="1.0"/><text x="650.0" y="420.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="14" fill="#1B2A41" text-anchor="start" font-weight="700" opacity="1.0">單排配筋的特例</text><text x="650.0" y="444.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">只有一排鋼筋時 dt = d，兩者混用不會出錯 —— 這正是</text><text x="650.0" y="461.4" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">雙排題最容易失分的地方。</text><rect x="636.0" y="518.0" width="316.0" height="118.0" rx="9" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.2" opacity="1.0"/><text x="652.0" y="544.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" font-weight="700" opacity="1.0">錨點只有一個</text><text x="652.0" y="568.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">極限狀態下，混凝土壓碎應變固定 εcu = 0.003。整</text><text x="652.0" y="585.4" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">條應變線就靠這個錨點 + 中性軸深度 c 完全決定。</text></svg>