f" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">是「能不能拿滿 φ=0.90」的獎勵線。兩者</text><text x="706.0" y="362.8" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">常被混為一談。</text><rect x="692.0" y="430.0" width="258.0" height="100.0" rx="9" fill="#DFF0E4" stroke="#1F7A4D" stroke-width="1.3" opacity="1.0"/><text x="708.0" y="458.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1F7A4D" text-anchor="start" font-weight="700" opacity="1.0">記法</text><text x="708.0" y="482.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1B2A41" text-anchor="start" opacity="1.0">鋼筋拉得越多 → 破壞前徵兆越明顯 → 規範</text><text x="708.0" y="499.4" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1B2A41" text-anchor="start" opacity="1.0">越放心 → φ 越高。</text></svg>