<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah1B2A41" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B2A41"/></marker><pattern id="conc" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#F4F6F9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#DCE6F0" stroke-width="1.6"/></pattern><pattern id="concC" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBE9E6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#C0392B" stroke-width="1.1" opacity="0.45"/></pattern></defs><rect x="0" y="0" width="980" height="690" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="980.0" height="4.0" rx="0" fill="#E8734A" stroke="none" stroke-width="0" opacity="1.0"/><circle cx="34.0" cy="40.0" r="16.0" fill="#1B2A41" stroke="none" stroke-width="0" opacity="1.0"/><text x="34.0" y="46.0" font-family="'Noto Serif CJK TC','Noto Serif CJK JP',serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" opacity="1.0">5</text><text x="60.0" y="47.0" font-family="'Noto Serif CJK TC','Noto Serif CJK JP',serif" font-size="21" fill="#1B2A41" text-anchor="start" font-weight="700" opacity="1.0">配筋量的三個門檻：ρmin、ρmax、ρb</text><text x="60.0" y="69.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#5C7A99" text-anchor="start" opacity="1.0">同一根梁，鋼筋放多放少決定它是「先裂」、「先降伏」還是「先壓碎」</text><rect x="78.0" y="170.0" width="72.8" height="26.0" rx="0" fill="#FBE1DE" stroke="none" stroke-width="0" opacity="1.0"/><rect x="150.8" y="170.0" width="378.7" height="26.0" rx="0" fill="#DFF0E4" stroke="none" stroke-width="0" opacity="1.0"/><rect x="529.5" y="170.0" width="248.5" height="26.0" rx="0" fill="#F6D8D2" stroke="none" stroke-width="0" opacity="1.0"/><line x1="78.0" y1="196.0" x2="802.0" y2="196.0" stroke="#1B2A41" stroke-width="1.6" marker-end="url(#ah1B2A41)"/><text x="810.0" y="201.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#1B2A41" text-anchor="start" font-weight="700" opacity="1.0">ρ = As /(b·d)</text><line x1="150.8" y1="166.0" x2="150.8" y2="204.0" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round" opacity="1.0"/><text x="150.8" y="222.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="700" opacity="1.0">ρmin</text><text x="150.8" y="240.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="middle" opacity="1.0">0.0033</text><line x1="529.5" y1="166.0" x2="529.5" y2="204.0" stroke="#E8734A" stroke-width="1.8" stroke-linecap="round" opacity="1.0"/><text x="529.5" y="222.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#E8734A" text-anchor="middle" font-weight="700" opacity="1.0">ρmax</text><text x="529.5" y="240.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="middle" opacity="1.0">0.0206</text><line x1="702.8" y1="166.0" x2="702.8" y2="204.0" stroke="#4C6B8A" stroke-width="1.8" stroke-linecap="round" opacity="1.0"/><text x="702.8" y="222.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13" fill="#4C6B8A" text-anchor="middle" font-weight="700" opacity="1.0">ρb</text><text x="702.8" y="240.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="middle" opacity="1.0">0.0286</text><circle cx="413.8" cy="196.0" r="6.5" fill="#1F7A4D" stroke="#FFFFFF" stroke-width="2" opacity="1.0"/><line x1="413.8" y1="196.0" x2="413.8" y2="150.0" stroke="#1F7A4D" stroke-width="1.2" stroke-linecap="round" opacity="1.0" stroke-dasharray="4,3"/><text x="413.8" y="144.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1F7A4D" text-anchor="middle" font-weight="700" opacity="1.0">例題① ρ = 0.0154</text><text x="114.4" y="188.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="700" opacity="1.0">少筋</text><text x="340.2" y="188.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1F7A4D" text-anchor="middle" font-weight="700" opacity="1.0">可 用 區 間（延性破壞）</text><text x="653.8" y="188.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="700" opacity="1.0">過筋（梁不得使用）</text><rect x="529.5" y="258.0" width="173.2" height="24.0" rx="5" fill="#FDF0E6" stroke="#E8734A" stroke-width="1.1" opacity="1.0"/><text x="616.1" y="275.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11" fill="#E8734A" text-anchor="middle" font-weight="700" opacity="1.0">規範先擋下來</text><text x="78.0" y="275.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" opacity="1.0">ρb 是「理論上」鋼筋降伏與混凝土壓碎同時發生的分界；規範不等到 ρb，提前在 ρmax（εt = 0.004）就把梁擋下來。</text><rect x="70.0" y="330.0" width="288.0" height="300.0" rx="9" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.2" opacity="1.0"/><rect x="70.0" y="330.0" width="288.0" height="5.0" rx="0" fill="#C0392B" stroke="none" stroke-width="0" opacity="1.0"/><text x="86.0" y="362.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" font-weight="700" opacity="1.0">少筋梁　ρ &lt; ρmin</text><rect x="90.0" y="382.0" width="74.0" height="148.0" fill="url(#conc)" stroke="#1B2A41" stroke-width="1.8"/><circle cx="104.0" cy="510.0" r="5.0" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="127.0" cy="510.0" r="5.0" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="150.0" cy="510.0" r="5.0" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><line x1="84.0" y1="396.8" x2="290.0" y2="396.8" stroke="#E8734A" stroke-width="1.3" stroke-linecap="round" opacity="1.0" stroke-dasharray="5,4"/><polygon points="250.0,382.0 276.0,382.0 250.0,396.8" fill="#FBE9E6" stroke="#C0392B" stroke-width="1.4" opacity="1.0"/><polygon points="250.0,396.8 194.0,510.0 250.0,510.0" fill="#E6EEF7" stroke="#2E6DA4" stroke-width="1.4" opacity="1.0"/><text x="280.0" y="390.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="10" fill="#C0392B" text-anchor="start" opacity="1.0">0.003</text><text x="190.0" y="518.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11" fill="#2E6DA4" text-anchor="end" font-weight="700" opacity="1.0">εt</text><text x="86.0" y="556.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">混凝土一開裂，全部拉力瞬間轉到少量鋼筋上 → </text><text x="86.0" y="573.4" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">鋼筋立刻拉斷，無預警。</text><text x="86.0" y="616.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#C0392B" text-anchor="start" font-weight="700" opacity="1.0">開裂彎矩 &gt; 極限彎矩</text><rect x="378.0" y="330.0" width="288.0" height="300.0" rx="9" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.2" opacity="1.0"/><rect x="378.0" y="330.0" width="288.0" height="5.0" rx="0" fill="#1F7A4D" stroke="none" stroke-width="0" opacity="1.0"/><text x="394.0" y="362.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13.5" fill="#1F7A4D" text-anchor="start" font-weight="700" opacity="1.0">適筋梁　ρmin ≤ ρ ≤ ρmax</text><rect x="398.0" y="382.0" width="74.0" height="148.0" fill="url(#conc)" stroke="#1B2A41" stroke-width="1.8"/><circle cx="412.0" cy="510.0" r="5.0" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="435.0" cy="510.0" r="5.0" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="458.0" cy="510.0" r="5.0" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><line x1="392.0" y1="432.3" x2="598.0" y2="432.3" stroke="#E8734A" stroke-width="1.3" stroke-linecap="round" opacity="1.0" stroke-dasharray="5,4"/><polygon points="558.0,382.0 584.0,382.0 558.0,432.3" fill="#FBE9E6" stroke="#C0392B" stroke-width="1.4" opacity="1.0"/><polygon points="558.0,432.3 517.9,510.0 558.0,510.0" fill="#E6EEF7" stroke="#2E6DA4" stroke-width="1.4" opacity="1.0"/><text x="588.0" y="390.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="10" fill="#C0392B" text-anchor="start" opacity="1.0">0.003</text><text x="513.9" y="518.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11" fill="#2E6DA4" text-anchor="end" font-weight="700" opacity="1.0">εt</text><text x="394.0" y="556.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">鋼筋先降伏 → 裂縫張開、大變形，最後混凝土才</text><text x="394.0" y="573.4" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">壓碎；破壞前有明顯徵兆。</text><text x="394.0" y="616.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1F7A4D" text-anchor="start" font-weight="700" opacity="1.0">εt ≥ 0.004，延性破壞</text><rect x="686.0" y="330.0" width="288.0" height="300.0" rx="9" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.2" opacity="1.0"/><rect x="686.0" y="330.0" width="288.0" height="5.0" rx="0" fill="#C0392B" stroke="none" stroke-width="0" opacity="1.0"/><text x="702.0" y="362.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" font-weight="700" opacity="1.0">過筋梁　ρ &gt; ρmax</text><rect x="706.0" y="382.0" width="74.0" height="148.0" fill="url(#conc)" stroke="#1B2A41" stroke-width="1.8"/><circle cx="720.0" cy="510.0" r="5.0" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="743.0" cy="510.0" r="5.0" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><circle cx="766.0" cy="510.0" r="5.0" fill="#2E6DA4" stroke="#1B2A41" stroke-width="1.2" opacity="1.0"/><line x1="700.0" y1="488.6" x2="906.0" y2="488.6" stroke="#E8734A" stroke-width="1.3" stroke-linecap="round" opacity="1.0" stroke-dasharray="5,4"/><polygon points="866.0,382.0 892.0,382.0 866.0,488.6" fill="#FBE9E6" stroke="#C0392B" stroke-width="1.4" opacity="1.0"/><polygon points="866.0,488.6 860.8,510.0 866.0,510.0" fill="#E6EEF7" stroke="#2E6DA4" stroke-width="1.4" opacity="1.0"/><text x="896.0" y="390.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="10" fill="#C0392B" text-anchor="start" opacity="1.0">0.003</text><text x="856.8" y="518.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11" fill="#2E6DA4" text-anchor="end" font-weight="700" opacity="1.0">εt</text><text x="702.0" y="556.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">鋼筋還沒降伏，受壓混凝土就先壓碎 → 脆性、突</text><text x="702.0" y="573.4" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">然，規範直接禁止。</text><text x="702.0" y="616.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#C0392B" text-anchor="start" font-weight="700" opacity="1.0">εt &lt; 0.004，脆性破壞</text><rect x="70.0" y="652.0" width="904.0" height="0.1" rx="0" fill="none" stroke="none" stroke-width="0" opacity="1.0"/></svg>