="332.0" y1="617.0" x2="332.0" y2="627.0" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="248.0" y1="622.0" x2="332.0" y2="622.0" stroke="#4C6B8A" stroke-width="1.1" marker-end="url(#ah4C6B8A)" marker-start="url(#ah4C6B8A)"/><text x="290.0" y="639.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#4C6B8A" text-anchor="middle" opacity="1.0">bw</text><line x1="109.0" y1="404.0" x2="119.0" y2="404.0" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="109.0" y1="446.0" x2="119.0" y2="446.0" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="114.0" y1="404.0" x2="114.0" y2="446.0" stroke="#4C6B8A" stroke-width="1.1" marker-end="url(#ah4C6B8A)" marker-start="url(#ah4C6B8A)"/><text x="106.0" y="429.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11" fill="#4C6B8A" text-anchor="end" opacity="1.0">hf</text><line x1="467.0" y1="404.0" x2="477.0" y2="404.0" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="467.0" y1="570.0" x2="477.0" y2="570.0" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><line x1="472.0" y1="404.0" x2="472.0" y2="570.0" stroke="#4C6B8A" stroke-width="1.1" marker-end="url(#ah4C6B8A)" marker-start="url(#ah4C6B8A)"/><text x="480.0" y="491.3" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#4C6B8A" text-anchor="start" opacity="1.0">d</text><text x="290.0" y="654.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="middle" opacity="1.0">翼板受壓、腹板放拉力筋 —— 這就是樓版梁的真實斷面</text><rect x="666.0" y="142.0" width="308.0" height="250.0" rx="9" fill="#1B2A41" stroke="none" stroke-width="0" opacity="1.0"/><text x="684.0" y="172.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="13.5" fill="#E8734A" text-anchor="start" font-weight="700" opacity="1.0">be 三個限制，取最小</text><circle cx="700.0" cy="212.0" r="12.0" fill="#E8734A" stroke="none" stroke-width="0" opacity="1.0"/><text x="700.0" y="217.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" opacity="1.0">①</text><text x="722.0" y="210.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700" opacity="1.0">L / 4</text><text x="722.0" y="230.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#DCE6F0" text-anchor="start" opacity="1.0">跨度的四分之一</text><circle cx="700.0" cy="270.0" r="12.0" fill="#E8734A" stroke="none" stroke-width="0" opacity="1.0"/><text x="700.0" y="275.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" opacity="1.0">②</text><text x="722.0" y="268.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700" opacity="1.0">bw + 16 hf</text><text x="722.0" y="288.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#DCE6F0" text-anchor="start" opacity="1.0">腹板寬 + 兩側各 8hf</text><circle cx="700.0" cy="328.0" r="12.0" fill="#E8734A" stroke="none" stroke-width="0" opacity="1.0"/><text x="700.0" y="333.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" opacity="1.0">③</text><text x="722.0" y="326.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700" opacity="1.0">梁心距 S</text><text x="722.0" y="346.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#DCE6F0" text-anchor="start" opacity="1.0">與隔壁梁中心的距離</text><text x="684.0" y="378.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="11.5" fill="#DCE6F0" text-anchor="start" font-style="italic" opacity="1.0">邊梁（L 形）另有一組較小的限制</text><rect x="666.0" y="410.0" width="308.0" height="112.0" rx="8" fill="#E6EEF7" stroke="none" stroke-width="0" opacity="1.0"/><rect x="666.0" y="410.0" width="4.5" height="112.0" rx="2" fill="#2E6DA4" stroke="none" stroke-width="0" opacity="1.0"/><text x="680.0" y="434.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="14" fill="#1B2A41" text-anchor="start" font-weight="700" opacity="1.0">be 只是「幾何」</text><text x="680.0" y="458.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">be 與鋼筋量、f'c 都無關，是規範用來近似樓版剪力</text><text x="680.0" y="475.4" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" opacity="1.0">遲滯效應的簡化值 —— 題目給的三個數字取小就好。</text><rect x="666.0" y="538.0" width="308.0" height="104.0" rx="9" fill="#DFF0E4" stroke="#1F7A4D" stroke-width="1.3" opacity="1.0"/><text x="684.0" y="564.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12.5" fill="#1F7A4D" text-anchor="start" font-weight="700" opacity="1.0">下一步才是力學</text><text x="684.0" y="588.0" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1B2A41" text-anchor="start" opacity="1.0">be 定了以後，先假設「中性軸在翼板內」用 b = be </text><text x="684.0" y="605.4" font-family="'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif" font-size="12" fill="#1B2A41" text-anchor="start" opacity="1.0">當矩形梁算 a，再驗證 a ≤ hf。</text></svg>